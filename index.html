<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>First Light</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0d22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="First Light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ground: #eef0f6;
    --surface: #ffffff;
    --ink: #1a1f36;
    --ink-soft: #545b78;
    --line: #d7dbe8;
    --sun: #f0a045;
    --sun-deep: #d9772b;
    --ok: #3f8f6b;
    --focus: #4b63d6;
    /* Text-sized versions of the accent and green, dark enough to read on the light background */
    --accent-text: #b0521a;
    --ok-text: #2c6e51;
    --field-line: #7f86a3;
    --placeholder: #6b7190;
    --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    --read: "Newsreader", Georgia, "Times New Roman", serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #11152a;
      --surface: #1a1f38;
      --ink: #eceaf4;
      --ink-soft: #a3a7c2;
      --line: #2e3456;
      --sun: #f5b25c;
      --sun-deep: #f08c3c;
      --ok: #6cc59b;
      --focus: #8fa2ff;
      --accent-text: #f08c3c;
      --ok-text: #6cc59b;
      --field-line: #6a72a0;
      --placeholder: #a3a7c2;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #11152a;
    --surface: #1a1f38;
    --ink: #eceaf4;
    --ink-soft: #a3a7c2;
    --line: #2e3456;
    --sun: #f5b25c;
    --sun-deep: #f08c3c;
    --ok: #6cc59b;
    --focus: #8fa2ff;
    --accent-text: #f08c3c;
    --ok-text: #6cc59b;
    --field-line: #6a72a0;
    --placeholder: #a3a7c2;
  }

  * { box-sizing: border-box; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  [tabindex="-1"]:focus { outline: none; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--display);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .app {
    max-width: 560px;
    margin: 0 auto;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    padding-inline: 16px;
    padding-block: 12px 24px;
    gap: 16px;
  }

  /* Horizon: a pre-dawn sky in both themes. The sun travels an arc,
     one stop per finished step; the axis shows real clock times. */
  .horizon {
    position: relative;
    border-radius: 18px;
    overflow: hidden;
    aspect-ratio: 16 / 7;
    max-width: 100%;
    background: #0a0d22;
  }
  .horizon svg { display: block; width: 100%; height: 100%; }
  .horizon .arc-rest { fill: none; stroke: #8d93c9; stroke-opacity: .35; stroke-width: .8; stroke-dasharray: 2 3; }
  .horizon .arc-done { fill: none; stroke: #f5b25c; stroke-width: 1.4; stroke-linecap: round; }
  .horizon .stop { fill: #3a3f6e; }
  .horizon .stop.passed { fill: #f5b25c; }
  .horizon .ground { fill: #070918; }
  .horizon .line { stroke: #ffffff; stroke-opacity: .18; stroke-width: .6; fill: none; }
  .horizon .tick { font-family: var(--mono); font-size: 7.5px; fill: #9aa0c8; letter-spacing: .04em; }
  .horizon .meta {
    position: absolute; inset: 12px 14px auto 14px;
    display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
    font-family: var(--mono); font-size: 12px; letter-spacing: .04em;
    color: #e6e4f2;
  }
  .horizon .meta .stage { color: #f5b25c; }
  .horizon .meta > span { white-space: nowrap; }
  @media (max-width: 380px) { .horizon .meta { font-size: 11px; inset: 10px 12px auto 12px; } }

  .steps {
    display: flex; gap: 6px; list-style: none; padding: 0; margin: 0;
  }
  .steps li {
    flex: 1; height: 4px; border-radius: 2px; background: var(--line);
    transition: background .4s;
  }
  .steps li.done { background: var(--sun-deep); }
  .steps li.now { background: var(--sun); }

  .card {
    flex: 1;
    display: flex; flex-direction: column; gap: 14px;
  }
  .eyebrow {
    font-family: var(--mono); font-size: 12px; text-transform: uppercase;
    letter-spacing: .12em; color: var(--ink-soft); margin: 0;
  }
  h1, h2 {
    font-weight: 700; margin: 0; text-wrap: balance; line-height: 1.12;
    letter-spacing: -.01em;
  }
  h1 { font-size: clamp(30px, 8vw, 40px); }
  h2 { font-size: clamp(24px, 6vw, 30px); }
  p { margin: 0; }
  .hl { font-style: normal; color: var(--accent-text); }
  .lede { color: var(--ink-soft); font-size: 17px; max-width: 60ch; overflow-wrap: anywhere; }
  h1, h2, .passage, .card p { overflow-wrap: anywhere; }

  .btnrow { display: flex; gap: 10px; flex-wrap: wrap; margin-top: auto; padding-top: 8px; }
  button, .door {
    font: inherit; font-weight: 600; font-size: 16px;
    border-radius: 999px; padding: 14px 22px; cursor: pointer;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  button.primary { background: var(--ink); color: var(--ground); border-color: var(--ink); flex: 1; }
  button.quiet { background: transparent; border-color: transparent; color: var(--ink-soft); padding-inline: 12px; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button:focus-visible, .door:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 3px solid var(--focus); outline-offset: 2px;
  }

  /* Breathe */
  .breath {
    display: grid; place-items: center; padding-block: 12px;
  }
  .breath .orb {
    width: min(58vw, 220px); aspect-ratio: 1; max-width: 100%;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 45%, var(--sun), var(--sun-deep));
    transform: scale(.55);
    transition: transform 4s ease-in-out;
    display: grid; place-items: center;
    color: #1a1f36; font-weight: 700; font-size: 20px;
  }
  .breath .count { font-family: var(--mono); color: var(--ink-soft); font-size: 13px; margin-top: 14px; }

  /* Read */
  .passage {
    font-family: var(--read); font-size: 20px; line-height: 1.6;
    max-width: 62ch;
    display: flex; flex-direction: column; gap: 14px;
  }
  .source { font-family: var(--mono); font-size: 12px; color: var(--ink-soft); letter-spacing: .03em; }
  .prompt {
    font-family: var(--read); font-style: italic; font-size: 18px;
    border-top: 1px solid var(--line); padding-top: 14px; color: var(--ink-soft);
  }

  /* Checklist */
  .checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .checks label {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px;
    background: var(--surface); cursor: pointer; font-size: 17px;
  }
  .checks input { width: 22px; height: 22px; accent-color: var(--ok); flex: none; }
  .checks label span { min-width: 0; overflow-wrap: anywhere; }
  .checks label:has(input:checked) { border-color: var(--ok); }
  .checks label:has(input:checked) span { text-decoration: line-through; color: var(--ink-soft); }

  .note {
    font-family: var(--read); font-size: 19px; line-height: 1.55;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px 18px; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .note.empty { color: var(--ink-soft); font-style: italic; }
  label.field { display: flex; flex-direction: column; gap: 6px; font-weight: 600; }
  input[type="text"], textarea {
    font: inherit; font-weight: 400; font-size: 17px;
    border: 1px solid var(--field-line); border-radius: 12px; padding: 12px 14px;
    background: var(--surface); color: var(--ink); width: 100%;
  }
  ::placeholder { color: var(--placeholder); opacity: 1; }
  textarea { font-family: var(--read); font-size: 18px; min-height: 96px; resize: vertical; }

  /* Done */
  .tally {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  }
  .tally div {
    border: 1px solid var(--line); border-radius: 14px; padding: 12px;
    background: var(--surface); display: flex; flex-direction: column; gap: 2px;
  }
  .tally b { font-family: var(--mono); font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .tally span { font-size: 12px; color: var(--ink-soft); }

  details.doors {
    border: 1px dashed var(--line); border-radius: 14px; padding: 12px 16px;
  }
  details.doors summary { cursor: pointer; font-weight: 600; color: var(--ink-soft); }
  .doors .inner { display: flex; flex-direction: column; gap: 12px; padding-top: 12px; }
  .doors .gate { font-family: var(--mono); font-size: 13px; color: var(--ink-soft); }
  .doorgrid { display: flex; flex-direction: column; gap: 10px; }
  .doorline { display: flex; flex-direction: column; gap: 8px; }
  .doorline input { min-width: 0; }
  .door[aria-disabled="true"] { opacity: .4; pointer-events: none; }
  .small { font-size: 13px; color: var(--ink-soft); }
  /* On its own line under the button, so it never wraps half beside it */
  .saved { display: block; margin-top: 8px; font-family: var(--mono); font-size: 13px; color: var(--ok-text); }

  /* Setup */
  .choices { display: flex; flex-direction: column; gap: 10px; }
  .choices button { justify-content: space-between; text-align: left; gap: 12px; border-radius: 14px; padding: 16px 18px; font-size: 17px; }
  .choices button strong { white-space: nowrap; }
  .choices button span { color: var(--ink-soft); font-weight: 400; font-size: 14px; text-align: right; }
  /* One-tap rating on the done screen */
  .rating { display: flex; flex-direction: column; gap: 8px; }
  .rating .row { display: flex; gap: 8px; }
  .rating .row button { flex: 1; font-size: 22px; padding: 10px; }
  .rating .row button[aria-pressed="true"] { background: var(--ink); color: var(--ground); border-color: var(--ink); }
  .rating .row button[aria-pressed="true"]:disabled { opacity: 1; }
  .statsline { font-size: 13px; color: var(--ink-soft); }
  /* First-open agreement */
  .terms { display: flex; flex-direction: column; gap: 12px; }
  .terms section { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .terms h3 { margin: 0 0 8px; font-size: 16px; display: flex; gap: 8px; align-items: center; }
  .terms ul { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; font-size: 15px; }
  .terms .yes h3 span { color: var(--ok-text); }
  .terms .no h3 span { color: var(--accent-text); }
  .terms a { color: var(--accent-text); font-weight: 600; }
  .agree { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border: 1px solid var(--field-line);
    border-radius: 14px; background: var(--surface); cursor: pointer; font-size: 16px; font-weight: 600; }
  .agree input { width: 22px; height: 22px; margin-top: 2px; flex: none; accent-color: var(--ok); }
  .agree:has(input:checked) { border-color: var(--ok); }

  /* "See exactly what's sent" */
  details.privacy { font-size: 14px; color: var(--ink-soft); }
  details.privacy summary { cursor: pointer; color: var(--accent-text); font-weight: 600; text-decoration: underline; }
  details.privacy h3 { font-size: 15px; color: var(--ink); margin: 14px 0 6px; }
  details.privacy ul { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; }
  details.privacy a { color: var(--accent-text); }
  .statsline button { font-size: 13px; padding: 4px 6px; text-decoration: underline; }

  /* App picker chips */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips button { border-radius: 999px; padding: 10px 14px; font-size: 15px; font-weight: 600; }
  .chips button[aria-pressed="true"] { background: var(--ink); color: var(--ground); border-color: var(--ink); }
  .chips button[aria-pressed="true"]::before { content: "✓ "; }
  /* Setup: main button full width, the quiet way out underneath */
  .btnrow.stack { flex-direction: column; align-items: stretch; }
  .howto { margin: 0; padding: 0 0 0 1.4em; display: flex; flex-direction: column; gap: 10px; font-size: 17px; max-width: 60ch; }
  .howto li::marker { color: var(--sun-deep); font-weight: 700; }
  .howto b { font-weight: 700; }
  .check { color: var(--ok-text); font-weight: 600; }
  .addr { font-family: var(--mono); font-size: 14px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px; overflow-wrap: anywhere; user-select: all; }

  .top { display: flex; justify-content: space-between; align-items: center; }
  .brand { font-weight: 700; letter-spacing: -.01em; }
  .brand i { font-style: normal; color: var(--accent-text); }

  @media (prefers-reduced-motion: reduce) {
    .breath .orb { transition: none; }
  }
</style>

<div class="app">
  <div class="top">
    <span class="brand">First <i>Light</i></span>
    <button class="quiet" id="restart" type="button" hidden>Start over</button>
  </div>

  <div class="horizon" aria-hidden="true">
    <svg viewBox="0 0 320 140" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#0a0d22"></stop>
          <stop offset="1" stop-color="#1b1d48"></stop>
        </linearGradient>
        <linearGradient id="dawnGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#2a3170" stop-opacity="0"></stop>
          <stop offset=".7" stop-color="#6b4a78" stop-opacity=".55"></stop>
          <stop offset="1" stop-color="#f0a045" stop-opacity=".75"></stop>
        </linearGradient>
        <radialGradient id="glowGrad">
          <stop offset="0" stop-color="#ffd48a" stop-opacity=".9"></stop>
          <stop offset=".35" stop-color="#f5a04a" stop-opacity=".45"></stop>
          <stop offset="1" stop-color="#f5a04a" stop-opacity="0"></stop>
        </radialGradient>
      </defs>
      <rect width="320" height="140" fill="url(#skyGrad)"></rect>
      <rect id="dawn" width="320" height="140" fill="url(#dawnGrad)" opacity="0"></rect>
      <g id="stars" fill="#dfe3ff">
        <circle cx="38" cy="30" r=".7"></circle><circle cx="72" cy="52" r=".5"></circle>
        <circle cx="118" cy="22" r=".6"></circle><circle cx="176" cy="44" r=".5"></circle>
        <circle cx="214" cy="18" r=".8"></circle><circle cx="262" cy="58" r=".5"></circle>
        <circle cx="296" cy="26" r=".6"></circle><circle cx="140" cy="70" r=".4"></circle>
      </g>
      <path id="arc" class="arc-rest" pathLength="1" d="M22 112 C 80 40, 190 18, 298 30"></path>
      <path id="arcDone" class="arc-done" pathLength="1" stroke-dasharray="0 1" d="M22 112 C 80 40, 190 18, 298 30"></path>
      <g id="stops"></g>
      <g id="sun">
        <circle r="30" fill="url(#glowGrad)"></circle>
        <circle r="5" fill="#fff6e2" stroke="#f5b25c" stroke-width="1.6"></circle>
      </g>
      <path class="ground" d="M0 106 Q 160 100 320 106 L 320 140 L 0 140 Z"></path>
      <path class="line" d="M0 106 Q 160 100 320 106"></path>
      <text class="tick" x="16" y="124" id="tStart">06:42 start</text>
      <text class="tick" x="304" y="124" text-anchor="end" id="tEnd">06:47 goal</text>
    </svg>
    <div class="meta"><span><span id="clock">06:42</span> · <span class="stage" id="stage">Pre-dawn</span></span><span id="date">Thu 24 Sep</span></div>
  </div>

  <ol class="steps" id="steps" aria-hidden="true"></ol>

  <main class="card" id="card"></main>
  <p class="sr-only" id="announce" aria-live="polite"></p>
</div>

<script>
(() => {
  // ---------- storage (per-device, optional) ----------
  const store = {
    // `valid` guards against corrupted or hand-edited storage: anything that fails it reads as the fallback
    get(k, fallback, valid = () => true) {
      try {
        const raw = localStorage.getItem("fl." + k);
        if (raw == null) return fallback;
        const v = JSON.parse(raw);
        return v != null && valid(v) ? v : fallback;
      } catch { return fallback; }
    },
    set(k, v) { try { localStorage.setItem("fl." + k, JSON.stringify(v)); } catch {} }
  };

  const dayKey = (d = new Date()) =>
    d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  // Adds whole calendar days to a "YYYY-MM-DD" key (not 24-hour blocks, so daylight saving can't skip a day)
  const addDays = (key, n) => {
    const [y, m, d] = key.split("-").map(Number);
    return dayKey(new Date(y, m - 1, d + n));
  };
  // Days since 1970 for a day key; used to rotate passages without repeating across New Year
  const dayNumber = (key) => {
    const [y, m, d] = key.split("-").map(Number);
    return Math.floor(Date.UTC(y, m - 1, d) / 864e5);
  };
  const fmtDay = (key) => {
    const [y, m, d] = key.split("-").map(Number);
    return new Date(y, m - 1, d).toLocaleDateString([], { weekday: "long", month: "short", day: "numeric" });
  };

  const isStreak = (v) => typeof v === "object" && Number.isInteger(v.count) && v.count >= 0 &&
    (v.last === null || typeof v.last === "string");
  const isLetter = (v) => typeof v === "object" && typeof v.text === "string" && typeof v.forDay === "string";
  const isText = (v) => typeof v === "string";

  // ---------- content ----------
  // Public-domain translations and texts. One per day, cycling.
  // Short quotes from real people, with a traceable source. Well-known misattributions are left out on purpose.
  // Each person gets their own shuffled order, one new quote per morning.
  const QUOTES = [
    {"text": "In the morning when thou risest unwillingly, let this thought be present: I am rising to the work of a human being.", "who": "Marcus Aurelius", "source": "Meditations V.1, tr. George Long"},
    {"text": "No longer talk at all about the kind of man that a good man ought to be, but be such.", "who": "Marcus Aurelius", "source": "Meditations X.16, tr. George Long"},
    {"text": "Such as are thy habitual thoughts, such also will be the character of thy mind; for the soul is dyed by the thoughts.", "who": "Marcus Aurelius", "source": "Meditations V.16, tr. George Long"},
    {"text": "Confine thyself to the present.", "who": "Marcus Aurelius", "source": "Meditations VII.29, tr. George Long"},
    {"text": "The universe is transformation: life is opinion.", "who": "Marcus Aurelius", "source": "Meditations IV.3, tr. George Long"},
    {"text": "Very little indeed is necessary for living a happy life.", "who": "Marcus Aurelius", "source": "Meditations VII.67, tr. George Long"},
    {"text": "Nothing, Lucilius, is ours, except time.", "who": "Seneca", "source": "Letters to Lucilius I, tr. R. M. Gummere"},
    {"text": "Hold every hour in your grasp.", "who": "Seneca", "source": "Letters to Lucilius I, tr. R. M. Gummere"},
    {"text": "Lay hold of to-day's task, and you will not need to depend so much upon to-morrow's.", "who": "Seneca", "source": "Letters to Lucilius I, tr. R. M. Gummere"},
    {"text": "While we are postponing, life speeds by.", "who": "Seneca", "source": "Letters to Lucilius I, tr. R. M. Gummere"},
    {"text": "Begin at once to live, and count each separate day as a separate life.", "who": "Seneca", "source": "Letters to Lucilius CI, tr. R. M. Gummere"},
    {"text": "No man was ever wise by chance.", "who": "Seneca", "source": "Letters to Lucilius LXXVI, tr. R. M. Gummere"},
    {"text": "It is not that we have a short time to live, but that we waste a lot of it.", "who": "Seneca", "source": "On the Shortness of Life"},
    {"text": "First say to yourself what you would be; and then do what you have to do.", "who": "Epictetus", "source": "Discourses III.23"},
    {"text": "No great thing is created suddenly.", "who": "Epictetus", "source": "Discourses I.15"},
    {"text": "If you want to improve, be content to be thought foolish and stupid.", "who": "Epictetus", "source": "Enchiridion 13"},
    {"text": "Men are disturbed not by the things which happen, but by the opinions about the things.", "who": "Epictetus", "source": "Enchiridion 5"},
    {"text": "Some things are in our control and others not.", "who": "Epictetus", "source": "Enchiridion 1"},
    {"text": "Morning is when I am awake and there is a dawn in me.", "who": "Henry David Thoreau", "source": "Walden"},
    {"text": "To be awake is to be alive.", "who": "Henry David Thoreau", "source": "Walden"},
    {"text": "Only that day dawns to which we are awake.", "who": "Henry David Thoreau", "source": "Walden"},
    {"text": "The morning, which is the most memorable season of the day, is the awakening hour.", "who": "Henry David Thoreau", "source": "Walden"},
    {"text": "Our life is frittered away by detail. Simplify, simplify.", "who": "Henry David Thoreau", "source": "Walden"},
    {"text": "Things do not change; we change.", "who": "Henry David Thoreau", "source": "Walden"},
    {"text": "If one advances confidently in the direction of his dreams, he will meet with a success unexpected in common hours.", "who": "Henry David Thoreau", "source": "Walden"},
    {"text": "Write it on your heart that every day is the best day in the year.", "who": "Ralph Waldo Emerson", "source": "Society and Solitude"},

  // Takes `n` items from a per-person shuffled deck stored under `key`, refilling it when it runs out
  function drawFromDeck(key, size, n, avoid = []) {
    let deck = store.get(key, [], Array.isArray).filter((i) => Number.isInteger(i) && i >= 0 && i < size);
    const out = [];
    while (out.length < n) {
      if (!deck.length) {
        deck = [...Array(size).keys()];
        for (let i = deck.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [deck[i], deck[j]] = [deck[j], deck[i]];
        }
        deck = deck.filter((i) => !avoid.includes(i) && !out.includes(i)).concat(deck.filter((i) => avoid.includes(i) || out.includes(i)));
      }
      const i = deck.shift();
      if (!out.includes(i)) out.push(i);
    }
    store.set(key, deck);
    return out;
  }
  const isIndexList = (size) => (v) => Array.isArray(v) && v.length > 0 && v.every((i) => Number.isInteger(i) && i >= 0 && i < size);

  // Today's quote stays the same for the whole day, then the next one in this person's deck
  function quoteFor(day) {
    const saved = store.get("quoteDay", null, (v) => typeof v === "object" && v.day === day && isIndexList(QUOTES.length)([v.i]));
    if (saved) return QUOTES[saved.i];
    const [i] = drawFromDeck("quoteDeck", QUOTES.length, 1, [store.get("quoteDay", {}, (v) => typeof v === "object").i]);
    store.set("quoteDay", { day, i });
    return QUOTES[i];
  }

  // Today's three get-up options, or the person's own list if they wrote one
  const isMyMoves = (v) => Array.isArray(v) && v.some((t) => typeof t === "string" && t.trim());
  function movesFor(day, reshuffle = false) {
    const mine = store.get("myMoves", null, isMyMoves);
    if (mine) return { items: mine.filter((t) => typeof t === "string" && t.trim()).slice(0, 6), mine: true };
    let picks = store.get("moves:" + day, null, isIndexList(MOVES.length));
    if (!picks || reshuffle) {
      picks = drawFromDeck("moveDeck", MOVES.length, 3, picks || []);
      store.set("moves:" + day, picks);
    }
    return { items: picks.map((i) => MOVES[i]), mine: false };
  }

  // A new line every time the app opens, with no repeats until all of them have been shown.
  function pickWakeLine() {
    let bag = store.get("lineBag", []);
    const last = store.get("lastLine", -1);
    bag = Array.isArray(bag) ? bag.filter((i) => Number.isInteger(i) && i >= 0 && i < WAKE_LINES.length) : [];
    if (!bag.length) {
      bag = WAKE_LINES.map((_, i) => i);
      for (let i = bag.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [bag[i], bag[j]] = [bag[j], bag[i]];
      }
      if (bag[0] === last && bag.length > 1) [bag[0], bag[1]] = [bag[1], bag[0]];
    }
    const pick = bag.shift();
    store.set("lineBag", bag);
    store.set("lastLine", pick);
    return WAKE_LINES[pick];
  }

  // ---------- anonymous stats (Supabase) ----------
  // What's sent: a random device id, the day, and counts/choices such as which steps were done.
  // Never sent: notes, intentions, or the names/addresses of anyone's own apps.
  // The publishable key is meant to be public; the database only lets it ADD rows to one table.
  const STATS = {
    url: "https://cnwwyucolebrcbydbfej.supabase.co/rest/v1/events",
    key: "sb_publishable_XpdHaGbjKX5CC0LRYiWBxQ_O8xO2oCs",
    version: "beta-1"
  };
  // Bump TERMS_VERSION when the wording changes in a way people should re-read; everyone is asked again.
  const TERMS_VERSION = "beta-1";
  const hasAgreed = () => {
    const a = store.get("agreed", null, (v) => typeof v === "object");

  };
  const statsOn = () => hasAgreed() && store.get("noStats", false) !== true;
  // Keep in sync with privacy.html (the shareable version of this)
  const PRIVACY_DETAILS = `<details class="privacy">
      <summary>See exactly what's sent</summary>
      <h3>What First Light sends</h3>
      <ul>
        <li>A random device ID made on your phone. It isn't linked to your name, email or any account.</li>
        <li>The date, and the time the record arrived.</li>
        <li>What you usually open in bed (social, games, videos, news or other), and which apps you picked from the list.</li>
        <li>How your morning went: minutes, streak, breathing done or skipped, how many get-up boxes you ticked, and whether you wrote an intention.</li>
        <li>Your 👎 / 👌 / 👍, if you tap one.</li>
        <li>Which app you opened from the one-job list, if any.</li>
      </ul>
      <h3>What it never sends</h3>
      <ul>
        <li>Your name, email, phone number or any account. There's no sign-up.</li>
        <li>Your notes, your intention, or your own get-up steps. Not a single word.</li>
        <li>The names or addresses of apps you added yourself, or anything you search for.</li>
        <li>Your location, contacts, photos or other apps. First Light can't see them.</li>
        <li>Anything at all once you tap "Turn off".</li>
      </ul>
      <p><a href="terms.html" target="_blank" rel="noopener">Full terms and privacy page</a></p>
    </details>`;
  function deviceId() {
    let id = store.get("deviceId", null, (v) => typeof v === "string" && /^[0-9a-f-]{36}$/.test(v));
    if (!id) {
      id = crypto.randomUUID ? crypto.randomUUID()
        : "10000000-1000-4000-8000-100000000000".replace(/[018]/g, (c) =>
          (c ^ (crypto.getRandomValues(new Uint8Array(1))[0] & (15 >> (c / 4)))).toString(16));
      store.set("deviceId", id);
    }
    return id;
  }
  let flushing = false;
  async function flushStats() {
    if (flushing || !statsOn() || !navigator.onLine) return;
    const outbox = store.get("outbox", [], Array.isArray);
    if (!outbox.length) return;
    flushing = true;
    try {
      const res = await fetch(STATS.url, {
        method: "POST",
        keepalive: true,
        headers: { apikey: STATS.key, "Content-Type": "application/json", Prefer: "return=minimal" },
        body: JSON.stringify(outbox)
      });
      // Sent, or rejected for good (bad data): either way don't retry these rows forever
      if (res.ok || (res.status >= 400 && res.status < 500 && res.status !== 408 && res.status !== 429)) {
        const now = store.get("outbox", [], Array.isArray);
        store.set("outbox", now.slice(outbox.length));
      }
    } catch { /* offline or blocked: keep them for next time */ }
    flushing = false;
  }
  function track(kind, data = {}) {
    if (!statsOn()) return;
    const onHome = navigator.standalone === true || window.matchMedia("(display-mode: standalone)").matches;
    const row = { device_id: deviceId(), day: (typeof run !== "undefined" && run) ? run.today : dayKey(),
      kind, data: { ...data, home_screen: onHome }, app_version: STATS.version };
    const outbox = store.get("outbox", [], Array.isArray).concat([row]).slice(-50);
    store.set("outbox", outbox);
    flushStats();
  }
  window.addEventListener("online", flushStats);

  // ---------- state ----------
  const STEPS = ["wake", "breathe", "read", "move", "plan", "done"];
  let step = 0;
  // Everything a run records belongs to the day it started, even if it finishes after midnight
  const newRun = () => {
    const today = dayKey();
    return { today, startedAt: Date.now(), quote: quoteFor(today), prompt: PROMPTS[dayNumber(today) % PROMPTS.length],
      stats: { breathe: "skipped", ticked: 0, reshuffles: 0, own_moves: false, intention: false, note: false, sent: false } };
  };
  let run = newRun();
  let wakeLine = pickWakeLine();

  const $ = (s, r = document) => r.querySelector(s);
  const card = $("#card");
  const stepsEl = $("#steps");
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // ---------- horizon ----------
  function tickClock() {
    const d = new Date();
    $("#clock").textContent = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    $("#date").textContent = d.toLocaleDateString([], { weekday: "short", day: "numeric", month: "short" });
  }
  // Where the sun sits on the arc for each step: just under the horizon at "wake", near the top at "done"
  const STOPS = STEPS.map((_, i) => 0.04 + (i / (STEPS.length - 1)) * 0.92);
  const STAGES = ["Pre-dawn", "Twilight", "First light", "Sunrise", "Morning", "Full morning"];
  const arc = $("#arc");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let sunAt = STOPS[0];
  let sunAnim = 0;
  const fmtTime = (ms) => new Date(ms).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

  $("#stops").innerHTML = STOPS.map((f) => {
    const pt = arc.getPointAtLength(f * arc.getTotalLength());
    return `<circle class="stop" r="1.6" cx="${pt.x.toFixed(1)}" cy="${pt.y.toFixed(1)}"></circle>`;
  }).join("");

  function drawSun(f) {
    const pt = arc.getPointAtLength(f * arc.getTotalLength());
    const t = (f - STOPS[0]) / (STOPS[STOPS.length - 1] - STOPS[0]);
    $("#sun").setAttribute("transform", `translate(${pt.x.toFixed(2)} ${pt.y.toFixed(2)})`);
    $("#arcDone").setAttribute("stroke-dasharray", `${f.toFixed(4)} 1`);
    $("#dawn").setAttribute("opacity", (0.15 + 0.85 * t).toFixed(3));
    $("#stars").setAttribute("opacity", (1 - t).toFixed(3));
  }
  function placeSun(setupLabel = null) {
    const at = setupLabel ? 0 : step;
    const target = STOPS[at];
    [...$("#stops").children].forEach((c, i) => c.classList.toggle("passed", !setupLabel && i <= step));
    $("#stage").textContent = setupLabel || STAGES[step];
    $("#tStart").textContent = setupLabel ? "tonight" : `${fmtTime(run.startedAt)} start`;
    $("#tEnd").textContent = setupLabel ? "tomorrow, 5 min"
      : step === STEPS.length - 1
        ? `${fmtTime(Date.now())} done`
        : `${fmtTime(run.startedAt + 5 * 60000)} goal`;
    cancelAnimationFrame(sunAnim);
    if (reduceMotion) { sunAt = target; drawSun(sunAt); return; }
    const from = sunAt, t0 = performance.now(), dur = 1400;
    const ease = (x) => 1 - Math.pow(1 - x, 3);
    const frame = (now) => {
      const k = Math.min(1, (now - t0) / dur);
      sunAt = from + (target - from) * ease(k);
      drawSun(sunAt);
      if (k < 1) sunAnim = requestAnimationFrame(frame);
    };
    sunAnim = requestAnimationFrame(frame);
  }
  function renderSteps() {
    stepsEl.innerHTML = STEPS.map((_, i) =>

    $("#restart").hidden = step === 0;
  }

  // ---------- screens ----------
  let breathTimer = null;
  let gateTimer = null;

  // The "one specific job" section: only the apps this person picked, behind a 10-second wait
  function doorsSection() {
    const picked = chosenDoors();
    if (picked === null) {
      return `<button class="quiet" id="pickDoors" type="button">Need an app for one job sometimes? Pick which ones</button>`;

      return `<form class="doorline" data-door="${k}">

    return `<details class="doors" id="doors">
          <summary>I need an app for one specific job</summary>

  function wireDoors() {
    const doors = $("#doors");

    const links = [...doors.querySelectorAll("a.door")];

    links.forEach((a) => a.addEventListener("click", (e) => {

  }

  const screens = {
    wake() {

      card.querySelectorAll("[data-rate]").forEach((b) => (b.onclick = () => {

  // Your own apps: a name and an address, up to five. Only web addresses are allowed.

  function renderSetup() {

    guardTaps();
    stepsEl.hidden = true;
    $("#restart").hidden = true;
    placeSun("Setting up");
    card.innerHTML = setupScreens[setupStep]();
    window.scrollTo(0, 0);
    announceScreen(setupStep < 5 ? `Setup, screen ${setupStep + 1} of 6` : "Setup finished");
    const go = (n) => { setupStep = n; renderSetup(); };
    const finish = () => {
      saveSetup({ done: true });
      const st = store.get("setup", {}, isSetup);
      track("setup_done", { habit: st.habit || null, doors: chosenDoors() || [], own_apps: customDoors().length, skipped: false });
      go(5);
    };

    on("sSkip", setupStep === 0 ? () => { saveSetup({ done: true }); track("setup_done", { skipped: true }); leaveSetup(); } : finish);

      const chips = [...card.querySelectorAll("[data-door]")];

  // Where the app starts: the agreement first, then setup, then the morning

  let tapGuardUntil = 0;

  // Phones often keep the page alive overnight. When it comes back on a new day, start that day's run,
  // unless someone is in the middle of a run that began shortly before midnight.
  function freshRunIfNewDay() {
    if (setupStep >= 0 || !hasAgreed() || dayKey() === run.today) return;

    const stale = Date.now() - run.startedAt > 3 * 3600e3;

    wakeLine = pickWakeLine();
    step = 0;
    render();
  }
  document.addEventListener("visibilitychange", () => { if (!document.hidden) freshRunIfNewDay(); });
  window.addEventListener("pageshow", freshRunIfNewDay);

  tickClock();
  setInterval(tickClock, 30000);
  flushStats();
  boot();
})();
</script>
