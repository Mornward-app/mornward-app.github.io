<style>
  /* Sizes are in rem (1rem = 16px by default) so the phone's own text-size setting scales everything */

      --bg: #0F1B2A; --text: #E8EFF7; --text-2: #A9B9CA; --button: #F2D77A; --button-text: #18222F;
      --sun: #F2D77A; --field: #182A3D; --field-line: #7F93A8; --placeholder: #93A5B8; --rule: #2A3E55;
      --error: #FFA394; --chip: #182A3D; --chip-line: #5E7894; --track: #2A3E55; --focus: #F2D77A;
      --pick-bg: #2E3A3A; --pick-line: #F2D77A;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0F1B2A; --text: #E8EFF7; --text-2: #A9B9CA; --button: #F2D77A; --button-text: #18222F;
    --sun: #F2D77A; --field: #182A3D; --field-line: #7F93A8; --placeholder: #93A5B8; --rule: #2A3E55;
    --error: #FFA394; --chip: #182A3D; --chip-line: #5E7894; --track: #2A3E55; --focus: #F2D77A;
      --pick-bg: #2E3A3A; --pick-line: #F2D77A;
  }
  @media (max-width: 374px) { :root { --gutter: 20px; } }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0;

  /* Mini tasks: wrapped chips; ticked ones get a check and the accent outline */

  .chip.pick .ck { display: none; width: 1.05em; height: 1.05em; stroke-width: 2.6; color: var(--text); }

  /* Save and Skip stay at the bottom of the screen while you look through the list */
  .actions.sticky { position: sticky; bottom: 0; z-index: 2; background: var(--bg); margin-inline: calc(-1 * var(--gutter));
    padding: 12px var(--gutter) max(8px, env(safe-area-inset-bottom)); box-shadow: 0 -12px 16px -12px rgba(15, 27, 42, .25); gap: 4px; }

  h1 {
    font-size: 2rem;           /* 32px */
    line-height: 2.375rem;     /* 38px */
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
    overflow-wrap: break-word;
  }
  /* Very narrow (a phone at 200% zoom, or very large text): the heading eases down a little so a word like
     "intention." still fits on one line instead of breaking before its full stop. It still grows with zoom. */
  h1 { font-size: min(2rem, 9vw + 0.75rem); line-height: 1.19; }
  @media (max-width: 260px) { h1 { font-size: 1.5rem; } }
  p { margin: 0; }
  .body { color: var(--text-2); }
  .support { font-size: 0.875rem; line-height: 1.25rem; color: var(--text-2); }
  .center { text-align: center; }
  .wordmark { font-size: 1.0625rem; font-weight: 600; letter-spacing: 0.01em; margin: 0; }
  .dateline { font-size: 0.75rem; line-height: 1rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-2); margin: 0; }
  a { color: var(--text); text-underline-offset: 2px; }

  button {
    font: inherit;
    font-size: 1.0625rem;
    font-weight: 600;
    min-height: 54px;
    padding: 14px 20px;
    border-radius: var(--radius);
    border: 2px solid transparent;
    cursor: pointer;
    touch-action: manipulation;
    width: 100%;
    text-align: center;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--text);
    background: transparent;
  }
  .primary { background: var(--button); color: var(--button-text); }
  .secondary { border-color: var(--button); }
  /* Text-style buttons still get a 44px+ tap area */
  .link {
    width: auto; min-height: 44px; padding: 10px 12px;
    text-decoration: underline; text-underline-offset: 3px; align-self: center;
  }
  .link.start { align-self: flex-start; margin-left: -12px; }
  .link.inline { display: inline-flex; min-height: 44px; padding: 0 4px; margin: 0; vertical-align: middle; }
  button:focus-visible, a:focus-visible, textarea:focus-visible, input:focus-visible, summary:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 3px;
  }
  button:disabled { opacity: .55; cursor: default; }
  /* Links that look like buttons (the calendar link) */
  a.button {
    font-weight: 600; min-height: 54px; padding: 14px 20px; border-radius: var(--radius); border: 2px solid var(--button);
    display: flex; align-items: center; justify-content: center; text-decoration: none; color: var(--text);
  }
  a.link { display: inline-flex; align-items: center; font-weight: 600; }
  .danger { background: var(--error); color: var(--bg); }
  .btnrow { display: flex; gap: 10px; flex-wrap: wrap; }
  .btnrow > button { flex: 1 1 140px; width: auto; }

  /* ---------- icons, chips, progress ---------- */
  .i { width: 1.25em; height: 1.25em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .tag { display: flex; align-items: center; justify-content: center; gap: 6px; }
  .tag .i { width: 1.1em; height: 1.1em; }
  /* Begin: what the minute holds, as three pictures */
  .flow { list-style: none; margin: 4px 0 0; padding: 0; display: flex; gap: 8px; }
  .flow li { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 12px 6px; border-radius: var(--radius); background: var(--chip); color: var(--text);
    font-size: 0.875rem; line-height: 1.125rem; font-weight: 600; text-align: center; }
  .flow .i { width: 28px; height: 28px; color: var(--text-2); }
  .flow li:last-child .i { color: var(--text); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    width: auto; min-height: 44px; padding: 8px 14px; border-radius: 999px; gap: 6px;
    background: var(--chip); border: 1.5px solid var(--chip-line); color: var(--text); font-size: 0.9375rem; font-weight: 600;
    max-width: 100%;
  }
  .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip .i { width: 1.05em; height: 1.05em; color: var(--text-2); }
  .chip[aria-pressed="true"] { border-color: var(--text); box-shadow: inset 0 0 0 1px var(--text); }
  .chip.add, #again { align-self: flex-start; }
  .seg { display: flex; gap: 0; border: 1.5px solid var(--chip-line); border-radius: 14px; overflow: hidden; }
  .seg button { flex: 1; min-height: 48px; border-radius: 0; font-size: 0.9375rem; }
  .seg button + button { border-left: 1.5px solid var(--chip-line); }
  .seg button[aria-pressed="true"] { background: var(--button); color: var(--button-text); }
  .ask { display: flex; flex-direction: column; gap: 12px; padding: 14px; border-radius: 12px; background: var(--field); color: var(--text); }
  .sl { display: flex; align-items: center; gap: 10px; }
  .sl .i { color: var(--text-2); }
  /* Home-screen box: one row at the bottom of Begin and Today */
  #installSlot:empty { display: none; }
  .installbox { position: relative; margin-top: 28px; padding: 10px 10px 10px 10px; border-radius: 18px; background: var(--field); border: 1.5px solid var(--chip-line);
    display: flex; align-items: center; gap: 8px; }
  .installbox img { width: 40px; height: 40px; border-radius: 10px; flex: none; }
  .itext { flex: 1; min-width: 0; }
  .itext h2 { margin: 0; font-size: 0.9375rem; line-height: 1.25rem; }
  .itext p { font-size: 0.8125rem; line-height: 1.125rem; color: var(--text-2); }
  .iadd { width: auto; min-height: 44px; padding: 8px 14px; font-size: 0.9375rem; flex: none; }
  .ix { width: 44px; min-height: 44px; padding: 0; flex: none; color: var(--text-2); }
  /* The box's ✕ sits on its corner: a small circle to see, a full 44px to tap */
  .ix.corner { position: absolute; top: -18px; right: -14px; }
  .ix.corner span { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
    background: var(--field); border: 1.5px solid var(--chip-line); }
  .ix.corner .i { width: 14px; height: 14px; stroke-width: 2.4; }
  .idone { color: var(--text); padding-right: 10px; }
  /* The guide: a sheet at the bottom, with an arrow toward the browser's own button */
  .guide { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; justify-content: flex-end; }
  .gback { position: absolute; inset: 0; background: rgba(10, 18, 30, .45); }
  .gsheet { position: relative; background: var(--bg); color: var(--text); border-radius: 22px 22px 0 0; max-height: 85vh; overflow: auto;
    padding: 18px var(--gutter) max(18px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 14px;
    max-width: 480px; width: 100%; margin: 0 auto; }
  .gsheet h2 { margin: 0; font-size: 1.25rem; line-height: 1.625rem; }
  @media (prefers-reduced-motion: no-preference) {
    .gsheet { animation: slideup .28s cubic-bezier(.2, .8, .2, 1); }
    .gback { animation: fadein .28s ease-out; }
    @keyframes slideup { from { transform: translateY(100%); } }
    @keyframes fadein { from { opacity: 0; } }
  }
  .gsheet .row .ix { margin-right: -10px; }
  .vsteps { list-style: none; margin: 0; padding: 0; display: flex; gap: 8px; counter-reset: st; }
  .vsteps li { flex: 1 1 0; min-width: 0; counter-increment: st; display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 12px 6px 10px; border-radius: 14px; background: var(--bg); font-size: 0.8125rem; line-height: 1.125rem; text-align: center; color: var(--text); }
  .vsteps .g { position: relative; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; background: var(--field); color: var(--text); }
  .vsteps .g .i { width: 22px; height: 22px; }
  .vsteps .g::before { content: counter(st); position: absolute; top: -6px; left: -6px; width: 18px; height: 18px; border-radius: 50%;
    background: var(--sun); color: #18222F; font-size: 0.6875rem; font-weight: 700; display: grid; place-items: center; line-height: 1; }
  .cantfind { font-size: 0.875rem; color: var(--text-2); }
  .cantfind summary { cursor: pointer; font-weight: 600; color: var(--text); min-height: 44px; display: flex; align-items: center; }
  .cantfind[open] { display: flex; flex-direction: column; gap: 8px; }
  /* On a computer: the phone card. Beside the app on wide screens, below it otherwise. */
  #handoffSlot:empty { display: none; }
  .handoff { margin-top: 24px; padding: 18px; border-radius: 20px; background: var(--field); border: 1.5px solid var(--chip-line);
    display: flex; gap: 18px; align-items: center; }
  .handoff .qr { width: 132px; flex: none; border-radius: 12px; overflow: hidden; }
  .handoff .qr svg { display: block; width: 100%; height: auto; }
  .hotext { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .hotext h2 { margin: 0; font-size: 1.125rem; line-height: 1.5rem; }
  .hotext p { font-size: 0.9375rem; line-height: 1.375rem; color: var(--text-2); }
  .horow { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
  .horow .secondary { width: auto; min-height: 44px; padding: 8px 14px; font-size: 0.9375rem; }
  @media (max-width: 420px) { .handoff { flex-direction: column; align-items: flex-start; } .handoff .qr { width: 160px; } }
  @media (min-width: 1000px) {
    .handoff { position: fixed; top: 96px; left: calc(50% + 264px); width: 300px; margin: 0; flex-direction: column; align-items: flex-start; }
    .handoff .qr { width: 200px; }
  }
  .seg + .support { margin-top: -6px; }
  .rempane { display: flex; flex-direction: column; gap: 12px; }
  .rempane[hidden] { display: none; }
  .vsteps.four li { font-size: 0.75rem; line-height: 1rem; }
  /* Your progress: real dates from the first routine to today (the last 7 once there are more). Fixed-width slots,
     left-aligned; dotted connectors run circle edge to circle edge. No future days. */
  .progress { display: flex; flex-direction: column; gap: 10px; --slot: 48px; --dot: 30px; }
  .progress .phead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .progress h2 { font-size: 1.0625rem; line-height: 1.5rem; margin: 0; }
  .progress .window { font-size: 0.75rem; line-height: 1rem; color: var(--text-2); }
  .progress ol { list-style: none; margin: 0; padding: 0; display: flex; justify-content: flex-start; }
  .progress li { position: relative; flex: 0 0 var(--slot); width: var(--slot); display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .progress li + li::before { content: ""; position: absolute; top: calc(var(--dot) / 2 - 1px); right: calc(50% + var(--dot) / 2 + 2px);
    width: calc(var(--slot) - var(--dot) - 4px); border-top: 2px dotted var(--chip-line); opacity: .7; }
  .progress .dot { width: var(--dot); height: var(--dot); border-radius: 50%; border: 2px solid var(--chip-line);
    background: transparent; display: grid; place-items: center; box-sizing: border-box; }
  /* A full routine: a solid warm-yellow circle */
  .progress .full .dot { background: var(--sun); border-color: var(--sun); }
  /* Reached the end with a step skipped (or a day from before steps were recorded): a small mark, never a full circle */
  .progress .part .dot { border-color: var(--sun); }
  .progress .part .dot::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--sun); }
  .progress .wd { font-size: 0.75rem; line-height: 1rem; color: var(--text); white-space: nowrap; }
  .progress .now .wd { font-weight: 700; }
  .progress .tl { font-size: 0.6875rem; line-height: 0.875rem; color: var(--text-2); min-height: 0.875rem; }
  .progress .count { font-size: 0.9375rem; line-height: 1.375rem; color: var(--text); margin: 2px 0 0; }
  @media (max-width: 359px) { .progress { --slot: 42px; --dot: 26px; } .progress .wd { font-size: 0.625rem; } }
  /* Test drive (preview build only): a slim tab, and a panel that slides up */
  .tdtab { width: auto; min-height: 44px; margin: 20px auto 0; padding: 8px 16px; gap: 8px; border-radius: 999px;
    font-size: 0.875rem; color: var(--text-2); border: 1.5px dashed var(--chip-line); }
  .tdgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tdgrid button { min-height: 48px; padding: 8px 10px; font-size: 0.9375rem; }

  /* ---------- sunrise ---------- */
  .sunrise { display: block; width: min(200px, 56%); height: auto; margin: 4px 0; }
  .sunrise.mid { margin-inline: auto; }
  .sunrise .disc { fill: var(--sun); }
  .sunrise .ray { stroke: var(--sun); stroke-width: 6; stroke-linecap: round; }
  .sunrise .horizon { stroke: var(--text); stroke-opacity: .28; stroke-width: 2; }
  /* Finish: the sun lifts out of the horizon, then its rays appear */
  .sunrise.rise .sunbody { animation: rise 1.4s cubic-bezier(.2, .7, .2, 1) both; }
  .sunrise.rise .rays { animation: rays 1.8s ease-out both; }
  @keyframes rise { from { transform: translateY(60px); } to { transform: none; } }
  @keyframes rays { 0%, 60% { opacity: 0; } 100% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .sunrise.rise .sunbody, .sunrise.rise .rays { animation: none; } }

  /* ---------- breathe ---------- */
  .orbwrap { display: grid; place-items: center; padding: 8px 0; min-height: min(220px, 32vh); }
  .orb {
    width: min(200px, 30vh, 60vw);
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle at 45% 40%, #FBEFC4 0%, var(--sun) 62%, #E9C65A 100%);
    transform: scale(.55);
    transition-property: transform;
    transition-timing-function: ease-in-out;
  }
  .orb[data-phase="in"] { transform: scale(1); }
  .orb[data-phase="out"] { transform: scale(.55); }
  .orbwrap { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .orbwrap.paused .orb { opacity: .55; }
  .bprog { display: flex; align-items: center; gap: 12px; }
  .dots { display: flex; gap: 10px; }
  .dots span { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--text-2); }
  .dots .done { background: var(--text-2); }
  .dots .now { border-color: var(--sun); background: var(--sun); }
  /* Reduced motion: no growing circle; the words carry the rhythm */
  @media (prefers-reduced-motion: reduce) {
    .orb, .orb[data-phase] { transform: none !important; transition: none !important; width: min(120px, 22vh, 40vw); }
    .orb[data-phase="out"] { opacity: .7; }
  }

  /* ---------- choose ---------- */
  .field { display: flex; flex-direction: column; gap: 8px; }
  .field label { font-weight: 600; }
  textarea {
    font: inherit;
    color: var(--text);
    background: var(--field);
    border: 2px solid var(--field-line);
    border-radius: var(--radius);
    padding: 14px 16px;
    min-height: 3.5rem;
    width: 100%;
    resize: none;
    overflow: hidden;
  }
  textarea::placeholder { color: var(--placeholder); opacity: 1; }
  .msg { font-size: 0.875rem; line-height: 1.25rem; color: var(--text-2); }
  .msg:empty { display: none; }
  .msg.err { color: var(--error); font-weight: 600; }
  .msg.ok { color: var(--text); font-weight: 600; }

  /* ---------- finish / today ---------- */
  .intention {
    background: var(--field);
    border-radius: var(--radius);
    padding: 12px 18px 14px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  const isText = (v) => typeof v === "string";

  // ---------- the routine ----------
  // Breathing pace: one breath is a full in and out. No holds.
  const BREATH = { inMs: 4000, outMs: 6000, count: 3 };
  // One mini task's length, in characters (the typed field's limit too)
  const MAX_INTENTION = 200;
  // A routine started shortly before midnight can still be finished after it
  const CARRY_OVER_MS = 3 * 3600e3;

  //   ready          no routine for today (Begin)
  //   breathing      phase "breathe", timer running      paused: phase "breathe", timer stopped (always after a reload)

  //   finish pending phase "finish": the Finish screen, Finish not tapped yet
  //   completed      phase "done": Today
  // { day, run, rid, phase, breaths, breathing: null|completed|skipped, tasks: null|saved|skipped, startedAt, finishedAt }
  // `tasks` is only what happened in this run's task step; edits after it never change it. `rid` tells two runs apart

  const PHASES = ["breathe", "choose", "finish", "done"];
  const isRoutine = (v) => typeof v === "object" && isDay(v.day) && PHASES.includes(v.phase) && Number.isInteger(v.run);
  // A routine saved by the previous version (beta-4) has `intention` instead of `tasks`
  const upgradeRoutine = (r) => (r && r.tasks === undefined && r.intention !== undefined ? { ...r, tasks: r.intention } : r);
  let routine = upgradeRoutine(store.get("routine", null, isRoutine));
  const saveRoutine = () => store.set("routine", routine);

  // Intentions keep the earlier version's key ("intent:YYYY-MM-DD"), so old ones show up, dated
  const intentKey = (day) => "intent:" + day;
  const draftKey = (day) => "draft:" + day;
  const intentionFor = (day) => {
    const t = store.get(intentKey(day), "", isText).trim();
    return t || store.get("practice-intent:" + day, "", isText).trim();
  };
  // Counts as saved only if the phone confirms it: written, then read back
  function saveIntention(day, text) {
    if (!text) return false;
    if (!store.set(intentKey(day), text)) return false;
    return store.get(intentKey(day), null, isText) === text;
  }
  // One task as typed: spaces tidied, at most MAX_INTENTION characters (whole characters, so an emoji isn't cut in
  // half). The " · " that joins saved tasks can't appear inside one, or a single typed task would read back as several;
  // a "·" inside a word (Catalan "col·laborar") is left alone.
  const cleanIntention = (raw) => Array.from(String(raw).normalize("NFC").replace(/\s+·\s+/g, ", ").replace(/\s+/g, " ").trim())
    .slice(0, MAX_INTENTION).join("").trim();

  // dropped, repeats dropped whatever their capitals (the first wording is kept), at most PICK_MAX.
  function normalizeTasks(picked, typed) {
    const tasks = [], seen = new Set();
    for (const raw of [...picked, typed]) {
      const t = cleanIntention(raw || "");
      const k = t.toLocaleLowerCase();
      if (t && !seen.has(k)) { seen.add(k); tasks.push(t); }
    }
    return { tasks, error: !tasks.length ? "empty" : tasks.length > PICK_MAX ? "too_many" : null };
  }

  // Days kept on the phone for the week strip and the mini-task rotation. Filled in once from earlier versions' data.
  //   days:     days a routine reached the end (Finish screen), whatever was skipped
  //   fullDays: days with a full routine: all three breaths AND mini tasks saved in the routine (recorded from beta-5;

  const isDayList = (v) => Array.isArray(v) && v.every(isDay);

      <li>Your mini tasks, or anything else you write. Not a single word.</li>

  // `columns` makes every row in a batch use the same columns, even rows queued by an older version.
  const ROW_KEYS = ["event_id", "device_id", "day", "kind", "data", "app_version"];
  const asRow = (r) => (r && typeof r === "object" ? { event_id: isUuid(r.event_id) ? r.event_id : uuid(), device_id: r.device_id,

      const res = await fetch(INGEST, {
        method: "POST",
        keepalive: true,
        headers: { apikey: STATS.key, "Content-Type": "application/json", Prefer: "return=minimal" },

    lock: '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',

      ${SUN(false)}
      <h1>${back ? "Welcome back." : "Before the scroll,<br>a few mini tasks."}</h1>
      ${startDay() ? progressSection() : ""}
      <ol class="flow" aria-label="Three breaths, a few mini tasks, then you're ready">
        <li>${icon("breath")}<span>3 breaths</span></li>
        <li>${icon("pen")}<span>Mini tasks</span></li>
        <li>${icon("sun")}<span>Ready</span></li>
      </ol>
      <div class="push">
        <button class="primary" id="begin" type="button">Begin</button>
        <p class="support center tag">${icon("clock")}About one minute</p>
        ${agreed ? "" : `<div class="consent" id="consent">
          <p>Free · No account · Your words stay on this phone.</p>
          <p>Tapping Begin accepts the <a href="terms.html" target="_blank" rel="noopener">beta terms</a>.</p>
          <p id="preStats"></p>
          <details><summary>What's counted</summary>${COUNTED}<p><b>Never sent:</b></p>${NOT_SENT}
            <p>Stored on Supabase in the United States and deleted within 90 days after the beta. You can change this
            here or any time later. Questions: ${CONTACT}</p></details>
        </div>`}
        ${earlier ? `<div class="more">${earlier}</div>` : ""}
      </div>`, back ? "Mornward. Welcome back." : "Mornward. Before the scroll, a few mini tasks.");
    $("#begin").onclick = begin;
    // The counts choice, before anything is sent
    const pre = $("#preStats");
    if (pre) {
      const draw = () => {
        const off = store.get("noStats", false) === true;
        pre.innerHTML = `Anonymous usage counts are ${off ? "off" : "on"}. <button class="link inline" type="button" id="preToggle">${off ? "Turn on" : "Turn off"}</button>`;
        $("#preToggle").onclick = () => { store.set("noStats", !off); if (!off) { store.set("outbox", []); store.set("viewbox", []); } draw(); $("#preToggle").focus(); };
      };
      draw();
    }
    // The home-screen box waits until someone has finished a routine; a computer gets the phone card right away
    if (doneDays().size) renderInstall();
    renderHandoff();
  }
  function begin() {
    if (!hasAgreed()) store.set("agreed", { version: TERMS_VERSION, on: dayKey(), how: "begin" });
    const today = dayKey();
    const first = store.get("everStarted", false) !== true;
    const run = routine && routine.day === today ? routine.run + 1 : 1;
    routine = { day: today, run, rid: uuid().slice(0, 8), phase: "breathe", breaths: 0, breathing: null, tasks: null, startedAt: nowMs() };
    saveRoutine();
    store.set("everStarted", true);
    if (!startDay()) store.set("startDay", today);
    emit("routine_started", { ...(via ? { via } : {}), ...(first ? { first: true, from: store.get("from", null) } : {}) });
    // Opened in the background (a restored tab): wait for a tap instead of breathing unseen
    renderBreathe(document.hidden);
  }

  // ---------- 2. Breathe ----------
  // The timer keeps its remaining time, so Pause stops exactly where the breath was.
  let br = null; // { phase: "in"|"out", left, at, timer, paused }
  function stopBreathing() {
    if (br && br.timer) clearTimeout(br.timer);
    br = null;
  }
  const breathLabel = () => `Breath ${Math.min(routine.breaths + 1, BREATH.count)} of ${BREATH.count}`;
  // One dot per breath: filled when done, the current one glows
  const dots = () => Array.from({ length: BREATH.count }, (_, i) =>
    `<span class="${i < routine.breaths ? "done" : i === routine.breaths ? "now" : ""}"></span>`).join("");
  function renderBreathe(paused) {
    show(`
      <h1 id="bword">${paused ? "Paused" : "Breathe in"}</h1>
      <div class="bprog"><div class="dots" id="bdots" aria-hidden="true">${dots()}</div><p class="support" id="bcount">${breathLabel()}</p></div>
      <div class="orbwrap" id="orbTap"><div class="orb" id="orb" aria-hidden="true"></div></div>
      <p class="sr-only" id="bstatus" role="status"></p>
      <div class="push">
        <button class="primary" id="bpause" type="button">${paused ? "Resume" : "Pause"}</button>
        <button class="link" id="bskip" type="button">Skip breathing</button>
      </div>`, `Breathing. ${breathLabel()}.`);
    br = { phase: "in", left: BREATH.inMs, at: 0, timer: 0, paused: true };
    const toggle = () => (br && br.paused ? resumeBreathing() : pauseBreathing());
    $("#bpause").onclick = toggle;
    // Tapping the circle does the same as the button: a big target for a sleepy thumb
    $("#orbTap").onclick = toggle;
    $("#bskip").onclick = () => {
      const breathsDone = routine.breaths;
      routine.breathing = "skipped";
      routine.phase = "choose";
      saveRoutine();
      emit("breathing_skipped", { breaths_done: breathsDone });
      renderChoose();
    };
    if (paused) { $("#bstatus").textContent = "Paused."; $("#orbTap").classList.add("paused"); }
    else resumeBreathing();
  }
  function setPhase(phase, ms) {
    const orb = $("#orb");
    br.phase = phase; br.left = ms; br.at = performance.now();
    $("#bword").textContent = phase === "in" ? "Breathe in" : "Breathe out";
    if (orb) {
      orb.style.transform = "";
      orb.style.transitionDuration = ms + "ms";
      orb.dataset.phase = phase;
    }
    buzz();
    br.timer = setTimeout(phaseDone, ms);
  }
  function phaseDone() {
    if (!br) return;
    // A breath never counts while the app is out of sight, even if the hide event was missed
    if (document.hidden) {
      pauseBreathing();
      // Resume starts this breath again from "in"
      const orb = $("#orb"); if (orb) delete orb.dataset.phase;
      br.phase = "in"; br.left = BREATH.inMs;
      return;
    }
    if (br.phase === "in") { setPhase("out", BREATH.outMs); return; }
    routine.breaths += 1;
    saveRoutine();
    $("#bdots").innerHTML = dots();
    if (routine.breaths >= BREATH.count) {
      routine.breathing = "completed";
      routine.phase = "choose";
      saveRoutine();
      emit("breathing_completed");
      renderChoose();
      return;
    }
    // Screen readers hear the breath number once per breath, not every in and out
    $("#bcount").textContent = breathLabel();
    $("#bstatus").textContent = breathLabel();
    setPhase("in", BREATH.inMs);
  }
  function pauseBreathing() {
    if (!br || br.paused) return;
    clearTimeout(br.timer);
    br.left = Math.max(0, br.left - (performance.now() - br.at));
    br.paused = true;
    const orb = $("#orb");
    if (orb) { orb.style.transform = getComputedStyle(orb).transform; orb.style.transitionDuration = "0ms"; }
    $("#orbTap").classList.add("paused");
    $("#bword").textContent = "Paused";
    $("#bpause").textContent = "Resume";
    $("#bstatus").textContent = "Paused.";
  }
  function resumeBreathing() {
    if (!br || !br.paused) return;
    br.paused = false;
    $("#orbTap").classList.remove("paused");
    $("#bpause").textContent = "Pause";
    $("#bstatus").textContent = "";
    const orb = $("#orb");
    if (orb && orb.dataset.phase) {
      // Carry on with the same breath from where it stopped
      $("#bword").textContent = br.phase === "in" ? "Breathe in" : "Breathe out";
      void orb.offsetWidth;
      orb.style.transitionDuration = br.left + "ms";
      orb.style.transform = "";
      br.at = performance.now();
      br.timer = setTimeout(phaseDone, br.left);
    } else {
      // First start: draw the circle small, then let it grow
      if (orb) void orb.offsetWidth;
      setPhase("in", BREATH.inMs);
    }
  }
  // Pause when the phone locks or another app comes to the front. Coming back stays paused until Resume is tapped.
  document.addEventListener("visibilitychange", () => { if (document.hidden) pauseBreathing(); });
  window.addEventListener("pagehide", pauseBreathing);

  // ---------- 3. Choose ----------
  // Mini tasks: chips you tap (ten at most). Two come ticked; people keep them or change them. Their own recent
  // tasks appear as extra chips (marked "again"), never ticked for them. Up to three tasks, saved together as one
  // entry: "Make my bed · Water first".
  //
  // The chips come from a curated bank, in themes. Each routine day shows ten, mixed across themes; the next routine
  // day shows the next ten, so the choices don't repeat day after day. It moves on only with days someone actually
  // did the routine, and stays the same all day. Each phone has its own shuffle (a random number kept on the phone,
  // never sent), reshuffled each time the bank comes round again. Nothing on screen mentions the bank.
  const BANK = {
    body: ["Stretch", "Ten squats", "Shoulder rolls", "Touch my toes", "Five push-ups", "Dance to one song"],
    food: ["Water first", "Healthy breakfast", "Fruit with breakfast", "Pack a lunch", "Protein breakfast", "Herbal tea"],
    outside: ["Step outside", "Short walk", "Morning light", "Open a window", "Walk the block"],
    focus: ["Plan my top 3", "One focused hour", "Hardest task first", "Set one goal", "Read 10 pages", "Write a to-do list"],
    home: ["Make my bed", "Tidy one spot", "Clear the sink", "Water a plant", "Empty the dishwasher"],
    people: ["Text someone", "Call family", "Thank someone", "Compliment a friend", "Check on a friend"],
    calm: ["No phone till dressed", "Phone in another room", "One quiet minute", "Write one line", "One thing I'm grateful for", "Cold water on my face"]
  };
  const POOL = new Set(Object.values(BANK).flat());
  const CHIP_MAX = 10; // chips on screen, your own included
  const PICK_MAX = 3;
  const SEP = " · ";
  const tasksOf = (text) => text.split(SEP).map((x) => x.trim()).filter(Boolean);
  // A small seeded random generator (mulberry32), so a phone's shuffle is the same every time it's worked out
  const seeded = (a) => () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  function taskSeed() {
    let v = store.get("taskSeed", null, Number.isInteger);
    if (v === null) { v = Math.floor(Math.random() * 2 ** 31); store.set("taskSeed", v); }
    return v;
  }
  const orders = new Map();
  // One full pass through the bank: themes taken in turn, so neighbours are from different themes
  function bankOrder(cycle) {
    if (orders.has(cycle)) return orders.get(cycle);
    const r = seeded(taskSeed() + cycle * 7919);
    const shuffle = (list) => { const x = list.slice(); for (let i = x.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [x[i], x[j]] = [x[j], x[i]]; } return x; };
    const themes = shuffle(Object.keys(BANK)).map((k) => shuffle(BANK[k]));
    const seq = [];
    for (let i = 0; seq.length < POOL.size; i++) for (const t of themes) if (t[i]) seq.push(t[i]);
    orders.set(cycle, seq);
    return seq;
  }
  // The ten for set number n. Where the bank comes round again (a new shuffle), anything shown in the set before is
  // skipped, so two routine days in a row never share a task.
  function setFor(n, avoid = []) {
    const len = POOL.size, out = [];
    for (let k = n * CHIP_MAX; out.length < CHIP_MAX && k < (n + 3) * CHIP_MAX + len; k++) {
      const x = bankOrder(Math.floor(k / len))[k % len];
      if (!out.includes(x) && !avoid.includes(x)) out.push(x);
    }
    return out;
  }
  // Today's ten: set number = routine days done before today
  function todaysSet(day) {
    const n = [...doneDays()].filter((d) => d < day).length;
    // Built day by day from the first, so "the day before" is exactly what was shown then
    let set = [];
    for (let i = 0; i <= n; i++) set = setFor(i, set);
    return set;
  }
  function ownRecent(day) {
    const own = [];
    for (const [, t] of earlierEntries(day)) for (const x of tasksOf(t)) {
      if (!own.includes(x) && !POOL.has(x)) own.push(x);
      if (own.length === 3) return own;
    }
    return own;
  }
  const isPicks = (v) => typeof v === "object" && Array.isArray(v.sel) && v.sel.every(isText) && typeof v.touched === "boolean";
  const picksKey = (day) => "picks:" + day;

  // editing: changing (or adding) mini tasks after the routine; `back` draws the screen to return to
  function renderChoose(editing = false, back = null) {
    const day = routine.day;
    const saved = intentionFor(day);
    const savedTasks = tasksOf(saved);
    const draft = store.get(draftKey(day), null, isText);
    const keptPicks = store.get(picksKey(day), null, isPicks);
    const set = todaysSet(day);
    const defaults = saved ? savedTasks : set.slice(0, 2);
    let sel = keptPicks ? keptPicks.sel.slice(0, PICK_MAX) : defaults.slice();
    let touched = keptPicks ? keptPicks.touched : false;
    // Every chip: your own recent ones, today's saved custom ones, then the starters
    const own = ownRecent(day).filter((x) => !savedTasks.includes(x));
    const custom = savedTasks.filter((x) => !set.includes(x));
    let options = [...custom, ...own, ...set];
    for (const x of sel) if (!options.includes(x)) options.unshift(x);
    // Ten at most: your own come first, so drop unticked bank chips from the end
    for (let i = options.length - 1; options.length > CHIP_MAX && i >= 0; i--) {
      if (set.includes(options[i]) && !sel.includes(options[i])) options.splice(i, 1);
    }
    // One screen, one button: tick, untick or type, then Save. (It used to switch between "Keep these" and
    // "Save my tasks", which read as two different steps.) After a failed save it says Retry.
    let retry = false;
    const label = () => (retry ? "Retry" : "Save my tasks");
    show(`
      <h1>What matters<br>this morning?</h1>
      <p class="body" id="pickHint">${saved ? "Today's tasks are ticked. Change them, or add your own." : "Two picked to start. Tap to change, or add your own. Up to 3."}</p>
      <div class="chips picks" id="ideas" role="group" aria-label="Mini tasks, up to ${PICK_MAX}">
        ${options.map((x, i) => `<button class="chip pick" type="button" data-idea="${i}" aria-pressed="${sel.includes(x)}">
          <svg class="i ck" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>${own.includes(x) ? `<svg class="i ag" viewBox="0 0 24 24" aria-hidden="true">${ICON.again}</svg>` : ""}<span>${esc(x)}</span>${own.includes(x) ? `<span class="sr-only"> (used before)</span>` : ""}</button>`).join("")}
      </div>
      <div class="field">
        <label for="intent">Add your own</label>
        <textarea id="intent" rows="1" maxlength="${MAX_INTENTION}" enterkeyhint="done" autocomplete="off"
          autocapitalize="sentences" placeholder="Something small is enough" aria-describedby="imsg">${esc(draft || "")}</textarea>
        <p class="msg" id="imsg" role="status"></p>
      </div>
      <div class="actions sticky">
        <button class="primary" id="isave" type="button">${label()}</button>
        <button class="link" id="iskip" type="button">${editing ? "Keep it as it was" : "Skip for today"}</button>
      </div>`, editing ? "Edit your mini tasks" : "What matters this morning?");
    const field = $("#intent");
    const msg = (t, err = false) => { $("#imsg").textContent = t; $("#imsg").className = "msg" + (err ? " err" : ""); };
    const grow = () => { field.style.height = "auto"; field.style.height = field.scrollHeight + 4 + "px"; };
    grow();
    // Drafts (typed words and ticks) are kept as you go, so a reload, a call or a closed tab doesn't lose them
    const keepDraft = () => {
      const kept = store.set(draftKey(day), field.value) && store.set(picksKey(day), { sel, touched });
      if (!kept) msg("This phone isn't saving drafts right now. Keep this page open.", true);
      else if ($("#imsg").classList.contains("err")) msg("");
    };
    const total = () => normalizeTasks(sel, field.value).tasks.length;
    const redraw = () => {
      card.querySelectorAll("[data-idea]").forEach((b) => b.setAttribute("aria-pressed", String(sel.includes(options[b.dataset.idea]))));
      $("#isave").textContent = label();
    };
    card.querySelectorAll("[data-idea]").forEach((b) => (b.onclick = () => {
      const x = options[b.dataset.idea];
      if (sel.includes(x)) sel = sel.filter((y) => y !== x);
      else if (total() >= PICK_MAX) { msg(`Up to ${PICK_MAX}. Untick one first.`, true); return; }
      else sel = [...sel, x];
      touched = true;
      msg("");
      redraw(); keepDraft();
    }));
    field.addEventListener("input", () => { grow(); if (cleanIntention(field.value)) touched = true; redraw(); keepDraft(); });
    // While typing, the chips fold away so Save sits right under the field, above the keyboard. They come back a
    // moment after typing ends, so a tap meant for Save lands before anything moves.
    let unfold = 0;
    field.addEventListener("focus", () => { clearTimeout(unfold); card.classList.add("typing"); });
    field.addEventListener("blur", () => { unfold = setTimeout(() => card.classList.remove("typing"), 450); });
    field.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); save(); } });
    // Keep Save in view once the keyboard opens
    field.addEventListener("focus", () => setTimeout(() => { const b = $("#isave"); if (b) b.scrollIntoView({ block: "nearest" }); }, 350));
    // Save is the only thing that confirms tasks; opening this screen confirms nothing.
    // In the routine it's this run's task step. As an edit (after the routine) it changes the saved tasks and
    // nothing else: no event, no change to what the routine recorded.
    let saving = false;
    // Nothing is shown as saved unless it was: the words and ticks stay, and the button offers Retry
    const failed = () => {
      keepDraft();
      retry = true; redraw();
      msg("Couldn't save on this phone. Your words are still here.", true);
    };
    const save = () => {
      if (saving) return;
      const typed = cleanIntention(field.value);
      const { tasks, error } = normalizeTasks(sel, typed);
      if (error === "empty") { msg("Write a few words or pick one, or skip for today.", true); return; }
      if (error === "too_many") { msg(`Up to ${PICK_MAX}. Untick one first.`, true); return; }
      saving = true;
      const text = tasks.join(SEP);
      if (!saveIntention(day, text)) { saving = false; failed(); return; }
      if (editing && back) { store.del(draftKey(day)); store.del(picksKey(day)); back(touched ? "Saved." : ""); return; }
      if (!reachFinish("saved")) { saving = false; failed(); return; }
      store.del(draftKey(day)); store.del(picksKey(day));
      // Counts only: how many, whether the suggested pair was kept as it was, whether they wrote their own
      emit("tasks_saved", { count: tasks.length, kept_defaults: !touched && !saved, own: !!typed || tasks.some((x) => !POOL.has(x)) });
    };
    $("#isave").onclick = save;
    $("#iskip").onclick = () => {
      if (editing && back) { store.del(draftKey(day)); store.del(picksKey(day)); back(""); return; }
      // Skipping never removes tasks already saved today, but this run's task step counts as skipped
      emit("tasks_skipped", { had_earlier: !!saved });
      reachFinish("skipped");
    };
  }

  // The end of the routine, recorded once per run (however often the Finish screen is drawn or the page reloads).
  // routine_finished: the end was reached, skips included. core_routine_completed: all three breaths AND tasks saved
  // in this run's task step (definition 2, from beta-5).
  const CORE_DEF = 2;
  // Returns false if the phone couldn't save the routine; nothing is recorded or shown as done then.
  function reachFinish(tasks) {
    const before = { ...routine };
    if (routine.phase === "choose") {
      routine.tasks = tasks;
      routine.phase = "finish";
    }
    if (!routine.finishedAt) {
      routine.finishedAt = nowMs();
      const core = routine.breathing === "completed" && routine.tasks === "saved";
      if (core && fullDays().size === 0) routine.firstFull = true;
      if (!saveRoutine()) { routine = before; return false; }
      markDone(routine.day);
      if (core) markDay("fullDays", routine.day);
      emit("routine_finished", { breathing: routine.breathing || "skipped", tasks: routine.tasks || "skipped", core, def: CORE_DEF,
        seconds: Math.round((routine.finishedAt - routine.startedAt) / 1000) });
      if (core) emit("core_routine_completed", { def: CORE_DEF });
    } else if (!saveRoutine()) { routine = before; return false; }
    renderFinish();
    return true;
  }

  // ---------- 4. Finish ----------
  // The saved tasks in a white card, as plain rows (reminders, not checkboxes: nothing here tracks doing them)
  function intentionBlock(text) {
    return `<div class="intention">
        <div class="row"><h2 class="ctitle">Your mini tasks</h2>
          <button class="link" id="iedit" type="button" aria-label="Edit your mini tasks">Edit</button></div>
        <ul class="rows" id="itext">${tasksOf(text).map((x) => `<li>${esc(x)}</li>`).join("")}</ul>
      </div>`;
  }
  const addButton = `<button class="chip add" id="iadd" type="button">${icon("plus")}<span>Add mini tasks</span></button>`;
  // What the end of the routine says, from what this run actually recorded (never from an edit afterwards)
  function finishWords(r) {
    if (r.breathing === "completed" && r.tasks === "saved")
      return [r.firstFull ? "Your first reset.<br>Complete." : "Morning reset complete.", "Three breaths taken. Mini tasks chosen."];
    if (r.tasks === "saved") return ["Your mini tasks are saved.", "Breathing skipped today."];
    if (r.breathing === "completed") return ["Three breaths taken.", "No mini tasks today."];
    return ["You're set for today.", "Breathing and mini tasks skipped."];
  }
  // The end of the routine: shown once, right after the task step. Done goes to Today; reopening later the same day
  // opens Today, so the celebration isn't replayed. `note` is set when coming back from an edit (no sunrise again).
  function renderFinish(note = "") {
    const text = intentionFor(routine.day);
    const [head, sub] = finishWords(routine);
    show(`
      <p class="wordmark center">mornward</p>
      ${SUN(true, !note, true)}
      <p class="dateline center">${esc(fmtDay(routine.day))}</p>
      <h1 class="center">${head}</h1>
      <p class="body center" id="finishSub">${esc(sub)}</p>
      ${text ? intentionBlock(text) : addButton}
      <p class="msg ok" role="status">${esc(note)}</p>
      ${progressSection()}
      <div class="push">
        <button class="primary" id="finish" type="button">Done</button>
      </div>`, head.replace("<br>", " "));
    ($("#iedit") || $("#iadd")).onclick = () => renderChoose(true, renderFinish);
    // Done only moves to Today: everything was recorded when this screen was reached, so extra taps change nothing
    $("#finish").onclick = () => {
      if (routine.phase === "finish") { routine.phase = "done"; saveRoutine(); }
      renderToday();
    };
  }

  // ---------- completed for today (also what a same-day reopen shows) ----------
  function renderToday(note = "") {
    if (!routine || routine.day !== dayKey()) { renderBegin(); return; }
    const text = intentionFor(routine.day);
    show(`
      <div class="row"><p class="wordmark">mornward</p><p class="support">${esc(fmtDay(routine.day))}</p></div>
      <h1>Done for today.</h1>
      ${text ? intentionBlock(text) : `<p class="body">No task today.</p>${addButton}`}
      <p class="msg ok" role="status">${esc(note)}</p>
      ${progressSection()}
      <button class="chip" id="again" type="button">${icon("again")}<span>Do the routine again</span></button>
      <div class="more">
        ${earlierSection(routine.day)}
        ${quietAdd()}
        ${reminderSection()}
        ${themeSection()}
        ${privacySection()}
      </div>`, "Done for today.");
    ($("#iedit") || $("#iadd")).onclick = () => renderChoose(true, renderToday);
    $("#again").onclick = begin;
    renderInstall();
    syncQuiet();
    renderHandoff();
    wireReminder();
    wireTheme();
    wirePrivacy();
  }

  // ---------- appearance: follows the phone, or pick light or dark ----------
  const THEMES = ["auto", "light", "dark"];
  let themeSet = false; // only clear a theme this page set itself (a host page may set its own)
  function applyTheme() {
    const t = store.get("theme", "auto", (v) => THEMES.includes(v));
    const root = document.documentElement;
    if (t === "auto") { if (themeSet) root.removeAttribute("data-theme"); themeSet = false; }
    else { root.setAttribute("data-theme", t); themeSet = true; }
    // The phone's status bar colour: its light/dark pair on Auto, the chosen background otherwise
    const bgNow = getComputedStyle(document.body).backgroundColor;
    document.querySelectorAll('meta[name="theme-color"]').forEach((m) => {

    for (const k of keys) {
      const m = k.match(/^(practice-)?intent:(\d{4}-\d{2}-\d{2})$/);
      if (!m || m[2] === today || byDay.has(m[2])) continue;
      const t = store.get(k, "", isText).trim();

  // ---------- Your progress: the days since you started, and what you did on them ----------
  // What it shows (also in supabase/METRICS.md, "Your progress"):
  //   dates       real local dates, from the first day you started a routine to today. Once that's more than 7 days,
  //               the latest 7, ending today ("Last 7 days"). Never a date before you started, never a future day.
  //   full        a solid yellow circle: a full routine that day (all three breaths AND mini tasks saved)
  //   part        a small mark: the routine reached the end with a step skipped (or the day is from before beta-5,
  //               when steps weren't recorded; those are never counted as full)
  //   none        a hollow circle: no routine finished that day
  //   count       days with a full routine, ever (a day counts once however many routines it had; days that leave the
  //               strip still count). On the phone only; separate from the stats.
  const daysBetween = (a, b) => {
    const t = (k) => { const [y, m, d] = k.split("-").map(Number); return Date.UTC(y, m - 1, d); };
    return Math.round((t(b) - t(a)) / 864e5);
  };
  const resetsLine = (n) => (n === 0 ? "No full morning resets yet" : `${n} morning reset${n === 1 ? "" : "s"} completed`);
  function progressSection() {
    const today = dayKey();
    let start = startDay() || today;
    if (start > today) start = today; // travelled west past the first day
    const rolling = daysBetween(start, today) >= 7;
    const first = rolling ? addDays(today, -6) : start;
    const full = fullDays(), done = doneDays();
    const dates = [];
    for (let d = first; d <= today; d = addDays(d, 1)) dates.push(d);
    const total = full.size;
    const said = [];
    const slots = dates.map((d) => {
      const [y, m, dd] = d.split("-").map(Number);
      const date = new Date(y, m - 1, dd);
      const wd = date.toLocaleDateString([], { weekday: "short" }).replace(/\.$/, "");
      const state = full.has(d) ? "full" : done.has(d) ? "part" : "none";
      const isToday = d === today;
      said.push(`${date.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" })}${isToday ? " (today)" : ""}: ${
        state === "full" ? "full morning reset" : state === "part" ? "reached the end, a step skipped" : "no reset"}`);
      return `<li class="${state}${isToday ? " now" : ""}"><span class="dot"></span><span class="wd">${esc(wd)} ${dd}</span><span class="tl">${isToday ? "Today" : ""}</span></li>`;
    }).join("");
    const countText = rolling && total ? `Total: ${resetsLine(total)}` : resetsLine(total);
    return `<section class="progress" aria-labelledby="progTitle">
        <div class="phead"><h2 id="progTitle">Your progress</h2>${rolling ? `<span class="window">Last 7 days</span>` : ""}</div>
        <ol aria-hidden="true">${slots}</ol>
        <p class="sr-only">${esc(said.join(". "))}.</p>
        <p class="count" id="progCount">${esc(countText)}</p>
      </section>`;
  }

  // ---------- an optional calendar reminder ----------
  // Mornward can't send notifications and never asks for permission. This hands a daily event to the person's
  // own calendar. It can't tell whether they saved it, so it never says the reminder is set, and isn't counted.
  const REMIND_DAYS = 7;
  const pad2 = (n) => String(n).padStart(2, "0");
  const isAlarmTime = (v) => typeof v === "string" && /^([01]\d|2[0-3]):[0-5]\d$/.test(v);
  function nextAlarm(v) {
    const [h, m] = v.split(":").map(Number);
    const d = now();
    d.setHours(h, m, 0, 0);
    if (d <= now()) d.setDate(d.getDate() + 1);
    return d;
  }
  const icsLocal = (d) => `${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}T${pad2(d.getHours())}${pad2(d.getMinutes())}00`;
  const REMIND_TITLE = "Mornward: three breaths, one mini task";
  // Continuity token, for one place only: the iPhone home-screen icon's start address (prepareIconStart). The icon
  // gets its own, empty storage; this lets it keep the same random ID, the terms version and the counts choice, so
  // one person isn't counted as two. It sits after "#" (never sent to a server) and holds no tasks, link source or
  // alarm time. With the counts off it carries no ID at all. Links that leave the phone (calendar events, the alarm
  // Shortcut, copied links) carry nothing: Google receives a calendar link's text, and calendars sync.
  function carryState() {
    const off = store.get("noStats", false) === true;
    const r = { v: 1, ...(off ? {} : { i: deviceId() }), t: hasAgreed() ? TERMS_VERSION : null, s: off ? 1 : 0 };
    return encodeURIComponent(JSON.stringify(r));
  }
  const carryLink = () => "https://mornward.app/?via=calendar";
  const reminderText = (link) => `Before the scroll: ${link}\nThree breaths, one mini task. About a minute.`;
  const icsEsc = (t) => t.replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
  // Calendar files want lines of at most 75 bytes; longer ones continue on the next line after a space
  const icsFold = (line) => {
    const out = []; let cur = "", bytes = 0;
    for (const ch of line) {
      const b = new TextEncoder().encode(ch).length;
      if (bytes + b > (out.length ? 74 : 75)) { out.push(cur); cur = ""; bytes = 0; }
      cur += ch; bytes += b;
    }
    out.push(cur);
    return out.join("\r\n ");
  };
  // The event keeps one UID per phone (a random value, not the stats ID), with SEQUENCE going up each time a file is
  // made, so a calendar that supports it can update the event instead of adding a second one. Whether it does is up
  // to the calendar app (see supabase/METRICS.md, "Reminders"). The time is "floating": 07:00 wherever the phone is.
  function calendarFile(v, link) {
    const start = nextAlarm(v);
    const made = new Date(); // the real moment the file is made, even in a preview
    const stamp = `${made.getUTCFullYear()}${pad2(made.getUTCMonth() + 1)}${pad2(made.getUTCDate())}T${pad2(made.getUTCHours())}${pad2(made.getUTCMinutes())}${pad2(made.getUTCSeconds())}Z`;
    let uid = store.get("remUid", null, (x) => typeof x === "string" && /^[0-9a-f]{32}$/.test(x));
    if (!uid) { uid = uuid().replace(/-/g, ""); store.set("remUid", uid); }
    const seq = store.get("remSeq", -1, Number.isInteger) + 1;
    store.set("remSeq", seq);
    return ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Mornward//EN", "CALSCALE:GREGORIAN", "METHOD:PUBLISH", "BEGIN:VEVENT",
      `UID:${uid}@mornward.app`, `SEQUENCE:${seq}`,
      `DTSTAMP:${stamp}`, `DTSTART:${icsLocal(start)}`, "DURATION:PT5M", `RRULE:FREQ=DAILY;COUNT=${REMIND_DAYS}`,
      `SUMMARY:${icsEsc(REMIND_TITLE)}`, `DESCRIPTION:${icsEsc(reminderText(link))}`, `URL:${link}`,
      "BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${icsEsc("Before the scroll: one mini task")}`, "TRIGGER:PT0M", "END:VALARM",
      "END:VEVENT", "END:VCALENDAR"].map(icsFold).join("\r\n") + "\r\n";
  }
  function googleCalendarLink(v, link) {
    const start = nextAlarm(v);
    const end = new Date(start.getTime() + 5 * 60000);
    const q = new URLSearchParams({ action: "TEMPLATE", text: REMIND_TITLE, details: reminderText(link),

  }
  // A morning reminder, set up for the person's phone (switchable):

  //   iPhone:  an Apple Calendar event with an alert (a calendar file made on the phone), or, better for the minute

  const alarmLink = () => "https://mornward.app/?via=alarm";
  function reminderSection() {
    const at = store.get("alarmAt", "", isAlarmTime) || "07:00";
    const os = isIOS ? "ios" : "android";
    const S = (g, t) => `<li><span class="g">${GLYPH[g]}</span><span>${t}</span></li>`;
    return `<details class="section" id="remindSec"><summary><span class="sl">${icon("cal")}Morning reminder</span></summary><div class="inner">
        <div class="seg" role="group" aria-label="Your phone">
          <button type="button" data-rem-os="ios" aria-pressed="${os === "ios"}">iPhone</button>
          <button type="button" data-rem-os="android" aria-pressed="${os === "android"}">Android</button>
        </div>
        <label class="flabel" for="remAt">Time</label>
        <input type="time" id="remAt" value="${esc(at)}">
        <div class="rempane" data-pane="android"${os === "android" ? "" : " hidden"}>
          <p>Opens Google Calendar with an event at this time for the next ${REMIND_DAYS} mornings. Save it there, and set its notification to “At time of event”.</p>
          <a class="button secondary" id="remGoogle" href="#" target="_blank" rel="noopener">Add to Google Calendar</a>
          <button class="link start" id="remIcsAlt" type="button">Use a calendar file instead</button>
          <p class="support">To stop it, delete the event in your calendar. It ends by itself after ${REMIND_DAYS} mornings.</p>
        </div>
        <div class="rempane" data-pane="ios"${os === "ios" ? "" : " hidden"}>
          <p>Makes an event with an alert at this time for the next ${REMIND_DAYS} mornings. Add it, then check the alert in Calendar.</p>
          <button class="secondary" id="remIcs" type="button">Add to Apple Calendar</button>
          <p class="support">To stop it, delete the event in Calendar. It ends by itself after ${REMIND_DAYS} mornings.</p>
          <details class="cantfind" id="remShortcut"><summary>Better: open Mornward when your alarm stops</summary>
            <p>Apple's Shortcuts app can do this every morning. It takes a minute, once.</p>
            <ol class="vsteps four">
              ${S("out", "Open <b>Shortcuts</b>, then <b>Automation</b>")}
              ${S("add", "<b>+</b>, <b>Alarm</b>, <b>Is Stopped</b>")}
              ${S("ok", "<b>Run Immediately</b>, <b>Next</b>")}
              ${S("share", "<b>Open URLs</b>: paste the link, <b>Done</b>")}
            </ol>
            <div class="horow">
              <button class="secondary" id="remCopy" type="button">Copy Mornward link</button>
              <a class="link" id="remShortcuts" href="shortcuts://">Open Shortcuts</a>
            </div>
            <input type="text" readonly aria-label="Mornward link for Shortcuts" id="remField" hidden>
            <p class="support">Steps can differ a little between iOS versions. To stop it, delete it under Automation in Shortcuts.</p>
          </details>
        </div>
        <p role="status" id="remMsg"></p>
      </div></details>`;
  }
  function wireReminder() {
    const g = $("#remGoogle");
    if (!g) return;
    const msg = (t) => { $("#remMsg").textContent = t; };
    const time = () => $("#remAt").value;
    const point = () => { if (isAlarmTime(time())) g.href = googleCalendarLink(time(), carryLink()); };
    point();
    $("#remAt").addEventListener("input", point);
    $("#remAt").addEventListener("change", point);
    const check = () => {
      if (isAlarmTime(time())) { store.set("alarmAt", time()); return true; }
      msg("Pick a time first."); $("#remAt").focus(); return false;
    };
    card.querySelectorAll("[data-rem-os]").forEach((b) => (b.onclick = () => {
      card.querySelectorAll("[data-rem-os]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      card.querySelectorAll(".rempane").forEach((pane) => { pane.hidden = pane.dataset.pane !== b.dataset.remOs; });
      msg("");
    }));
    g.onclick = (e) => {
      if (!check()) { e.preventDefault(); return; }
      point();
      // We can only hand it over, not confirm it was saved
      msg("Google Calendar opened. Save the event there to keep it.");
      emitDay("reminder_setup", { action: "google_link" }, "google_link");
    };
    const file = () => {
      if (!check()) return;
      const a = document.createElement("a");
      a.href = "data:text/calendar;charset=utf-8," + encodeURIComponent(calendarFile(time(), carryLink()));
      a.download = "mornward.ics";
      document.body.appendChild(a); a.click(); a.remove();
      msg(isIOS ? "Tap Add to Calendar on the next screen. If a file downloaded instead, open it from Downloads."
        : "Open the downloaded file to add it to your calendar.");
      emitDay("reminder_setup", { action: "calendar_file" }, "calendar_file");
    };
    $("#remIcs").onclick = file;
    $("#remIcsAlt").onclick = file;
    $("#remCopy").onclick = async () => {
      const url = alarmLink();
      try { await navigator.clipboard.writeText(url); msg("Copied. Paste it in the Open URLs step."); }
      catch { const f = $("#remField"); f.value = url; f.hidden = false; f.focus(); f.select(); msg("Copy this link, then paste it in the Open URLs step."); }
      emitDay("reminder_setup", { action: "shortcut_link" }, "shortcut_link");
    };
  }

  // ---------- privacy and your data ----------
  function privacySection() {
    const id = store.get("deviceId", null, (v) => typeof v === "string" && /^[0-9a-f-]{36}$/.test(v));
    const ask = id ? `mailto:${CONTACT}?subject=${encodeURIComponent("Delete my Mornward data")}&body=${
      encodeURIComponent("Please delete the stats for this ID: " + id)}` : "";
    return `<details class="section" id="privSec"><summary><span class="sl">${icon("lock")}Privacy and your data</span></summary><div class="inner">
        <p>Your tasks are saved only in this browser on this phone. Clearing browser data deletes them.</p>
        <p id="statsLine"></p>
        <h3>What's counted</h3>${COUNTED}
        <h3>What's never sent</h3>${NOT_SENT}
        <p>Stored on Supabase in the United States, never sold or used for ads, deleted within 90 days after the beta ends.
          <a href="terms.html" target="_blank" rel="noopener">Full terms</a></p>
        ${id ? `<p>Your anonymous ID:</p><code class="myid" id="myId">${esc(id)}</code>
          <p>To see or delete the stats sent with it, email it to <a href="${ask}">${CONTACT}</a>. Handled within 30 days.</p>`
        : `<p>No stats have been sent from this phone.</p>`}
        <button class="link start" type="button" id="wipeLocal" aria-expanded="false" aria-controls="wipeAsk">Delete everything on this phone</button>
        <div class="ask" id="wipeAsk" hidden>
          <p><b>Delete your tasks and settings on this phone?</b> This can't be undone.${id ? " It doesn't delete counts already sent: those are on Supabase, under the ID above, and this phone forgets that ID. To have them deleted too, email the ID first." : ""}</p>
          <div class="btnrow"><button class="danger" type="button" id="wipeYes">Delete everything</button>
            <button class="secondary" type="button" id="wipeNo">Cancel</button></div>
        </div>
      </div></details>`;
  }
  function wirePrivacy() {
    const draw = () => {
      $("#statsLine").innerHTML = statsOn()
        ? `Anonymous counts are on. <button class="link inline" type="button" id="statsToggle">Turn off</button>`
        : `Anonymous counts are off. <button class="link inline" type="button" id="statsToggle">Turn back on</button>`;
      $("#statsToggle").onclick = () => {
        if (statsOn()) { store.set("noStats", true); store.set("outbox", []); store.set("viewbox", []); }
        else store.set("noStats", false);
        draw();
      };
    };
    draw();
    // Asked on the page itself, not in a browser dialog (some app views never show those)
    const ask = (open) => { $("#wipeAsk").hidden = !open; $("#wipeLocal").setAttribute("aria-expanded", String(open)); };
    $("#wipeLocal").onclick = () => { ask(true); $("#wipeNo").focus(); };
    $("#wipeNo").onclick = () => { ask(false); $("#wipeLocal").focus(); };
    $("#wipeYes").onclick = () => {
      store.keys().forEach((k) => store.del(k));
      location.reload();
    };
  }

  // ---------- arriving from a reminder, a link, or the iPhone home-screen icon ----------
  // Opened from the calendar reminder or the iPhone alarm Shortcut
  const via = (() => { const v = new URLSearchParams(location.search).get("via"); return v === "calendar" || v === "alarm" ? v : null; })();
  const viaCalendar = via !== null;
  // The reminder link carries the anonymous ID and choices. A browser that has never seen Mornward (the first
  // visit happened inside another app's browser) takes them, so the same person isn't counted twice.
  (() => {
    const m = location.hash.match(/^#r=(.+)$/);
    if (!m) return;
    try { history.replaceState(null, "", location.pathname + location.search); } catch {}
    if (store.get("deviceId", null) !== null) return;
    // Only the home-screen icon may carry an ID in, plus reminder links made by earlier versions (beta-4 and before put
    // it in calendar events). A copied browser address can carry one too, and a friend opening it must not become
    // the same anonymous person.
    if (!onHomeScreen && !viaCalendar) return;
    let r;
    try { r = JSON.parse(decodeURIComponent(m[1])); } catch { return; }
    if (!r || typeof r !== "object" || r.v !== 1) return;
    if (typeof r.i === "string" && /^[0-9a-f-]{36}$/.test(r.i)) { store.set("deviceId", r.i); store.set("everStarted", true); }
    if (r.t === TERMS_VERSION) store.set("agreed", { version: TERMS_VERSION, on: dayKey(), how: "carried" });
    if (r.s === 1) store.set("noStats", true);
    if (isAlarmTime(r.a)) store.set("alarmAt", r.a);
    if (typeof r.f === "string" && /^[a-z0-9-]{1,20}$/.test(r.f)) store.set("from", r.f);
    // Links from the previous version could carry a note; keep it, dated
    if (typeof r.n === "string" && r.n.trim() && isDay(r.nd) && !store.get("letter", null, isLetter))
      store.set("letter", { text: r.n.slice(0, 200), forDay: r.nd, writtenOn: isDay(r.nw) ? r.nw : r.nd });
  })();
  // People who used the previous version aren't new: their first routine here isn't marked as a first visit
  if (store.get("everStarted", false) !== true && (store.get("setup", null) || store.get("agreed", null))) store.set("everStarted", true);
  // Which link someone came from (?from=reddit). Kept on the phone, sent once with the first routine.
  const linkFrom = (() => {
    const v = (new URLSearchParams(location.search).get("from") || "").toLowerCase();
    return /^[a-z0-9-]{1,20}$/.test(v) ? v : null;
  })();
  if (linkFrom && store.get("from", null) === null) store.set("from", linkFrom);
  // On iPhone the home-screen icon starts with empty storage. Point it at an address that carries the link
  // source and the anonymous ID and choices (after "#", never sent anywhere). Intentions are not carried:
  // they would end up in the address. Safari uses the manifest's start address if it reads it, otherwise the page's.
  function prepareIconStart(updateAddress = false) {
    if (!isIOS || onHomeScreen) return;
    const from = store.get("from", null);
    const known = hasAgreed();
    if (!from && !known) return;
    const rel = "./" + (from ? "?from=" + encodeURIComponent(from) : "") + (known ? "#r=" + carryState() : "");
    const abs = (u) => new URL(u, location.href).href;
    const m = { name: "Mornward", short_name: "Mornward", start_url: abs(rel), scope: abs("./"),
      display: "standalone", background_color: "#EDF5FC", theme_color: "#EDF5FC",
      icons: [{ src: abs("icons/icon-192.png"), sizes: "192x192", type: "image/png" },
              { src: abs("icons/icon-512.png"), sizes: "512x512", type: "image/png" }] };
    const link = document.querySelector('link[rel="manifest"]');
    if (link) link.href = "data:application/manifest+json," + encodeURIComponent(JSON.stringify(m));
    if (known && updateAddress) { try { history.replaceState(null, "", rel); } catch {} }
  }
  prepareIconStart();
  // The "Copy link" in the add guide: the link source only. (An ID here was never accepted by the browser it's pasted
  // into, and a copied link can end up anywhere.)
  function shareUrl() {
    const from = store.get("from", null);
    return "https://mornward.app/" + (from ? "?from=" + encodeURIComponent(from) : "");
  }

  // ---------- which screen to show ----------
  // Today's routine picks up where it was (breathing comes back paused). A routine from an earlier date is
  // never shown as today's; it's under "Earlier tasks", dated. One started just before midnight can be finished.
  function home() {
    const today = dayKey();
    routine = store.get("routine", null, isRoutine);
    const r = routine;
    const current = r && (r.day === today ||
      (r.phase !== "done" && r.day === addDays(today, -1) && nowMs() - r.startedAt < CARRY_OVER_MS));
    if (!current) renderBegin();
    else if (r.phase === "breathe") renderBreathe(true);
    else if (r.phase === "choose") renderChoose();
    // The end-of-routine screen is shown once; reopening later goes to Today (no replayed celebration)
    else renderToday();
  }
  // Phones keep pages alive for days. Coming back on a new date shows that day's Begin, unless a routine
  // is in progress on screen (breathing or typing), which stays put.
  let shownFor = dayKey();
  function checkDay() {
    if (document.hidden) return;
    const today = dayKey();
    if (today === shownFor) return;
    if (br || $("#intent")) return;
    shownFor = today;
    home();
  }
  document.addEventListener("visibilitychange", checkDay);
  window.addEventListener("pageshow", checkDay);
  setInterval(checkDay, 60000);

  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
  // ---------- Test drive (preview build only) ----------
  // A slim tab at the bottom; tapping it slides up a panel to try other days, themes and phones. Nothing is sent.
  function previewBar() {
    if (!PREVIEW) return;
    const tab = document.createElement("button");
    tab.type = "button";
    tab.className = "tdtab";
    tab.id = "tdTab";
    tab.setAttribute("aria-haspopup", "dialog");
    tab.innerHTML = `<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span>Test drive</span>`;
    document.querySelector(".app").appendChild(tab);
    const theme = () => store.get("theme", "auto", (v) => THEMES.includes(v));
    const phone = () => ({ ios: "iPhone", android: "Android", computer: "Computer" }[store.get("previewPlatform", "")] || "this device");
    const close = () => { const d = $("#testDrive"); if (d) { d.remove(); tab.focus(); } };
    const open = () => {
      close();
      const shifted = shiftMs() !== 0;
      const wrap = document.createElement("div");
      wrap.className = "guide";
      wrap.id = "testDrive";
      wrap.innerHTML = `<div class="gback" data-td-close></div>
        <div class="gsheet" role="dialog" aria-modal="true" aria-labelledby="tdTitle">
          <div class="row"><h2 id="tdTitle" tabindex="-1">Test drive</h2>
            <button class="ix" data-td-close type="button" aria-label="Close"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
          <p class="support">Try other days, themes and phones. Nothing is sent.${shifted ? ` Pretending it's <b>${esc(fmtDay(dayKey()))}</b>.` : ""}</p>
          <div class="tdgrid">
            <button type="button" class="secondary" id="pvNext">Next day</button>
            ${shifted ? `<button type="button" class="secondary" id="pvToday">Back to today</button>` : ""}
            <button type="button" class="secondary" id="pvTheme">Theme: ${esc(theme())}</button>
            <button type="button" class="secondary" id="pvPhone">Steps: ${esc(phone())}</button>
            <button type="button" class="secondary" id="pvReset">Start fresh</button>
          </div>
        </div>`;
      document.body.appendChild(wrap);
      wrap.querySelectorAll("[data-td-close]").forEach((x) => (x.onclick = close));
      // Tomorrow at 7:00, so the morning always looks like a morning
      $("#pvNext").onclick = () => {
        const t = now(); t.setDate(t.getDate() + 1); t.setHours(7, 0, 0, 0);
        store.set("previewShift", t.getTime() - Date.now()); close(); home();
      };
      if ($("#pvToday")) $("#pvToday").onclick = () => { store.del("previewShift"); close(); home(); };
      $("#pvTheme").onclick = () => {
        store.set("theme", THEMES[(THEMES.indexOf(theme()) + 1) % THEMES.length]); applyTheme();
        $("#pvTheme").textContent = "Theme: " + theme();
        card.querySelectorAll("[data-theme-pick]").forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.themePick === theme())));
      };
      $("#pvPhone").onclick = () => {
        const order = [null, "ios", "android", "computer"], cur = store.get("previewPlatform", null);
        const next = order[(order.indexOf(cur) + 1) % order.length];
        if (next) store.set("previewPlatform", next); else store.del("previewPlatform");
        $("#pvPhone").textContent = "Steps: " + phone();
        refreshHome();
        if (card.querySelector("#begin, #again")) renderHandoff();
      };
      $("#pvReset").onclick = () => { store.keys().forEach((k) => store.del(k)); location.reload(); };
      $("#tdTitle").focus();
    };
    tab.onclick = open;
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
  }

  applyTheme();
  flushStats();
  home();
  previewBar();
})();
</script>
