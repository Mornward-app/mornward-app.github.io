<style>
  /* Sizes are in rem (1rem = 16px by default) so the phone's own text-size setting scales everything */
  :root {
    color-scheme: light;
    --bg: #EDF5FC;
    --text: #20344C;
    --text-2: #4B6075;
    --button: #25374D;
    --button-text: #FFFFFF;
    --sun: #F2D77A;
    --field: #FFFFFF;
    /* Field edge and placeholder: at least 3:1 and 4.5:1 against white */
    --field-line: #6B7F94;
    --placeholder: #5F7388;
    --rule: #C9D7E5;
    --error: #9A2A1F;
    --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --gutter: 24px;
    --radius: 16px;
  }
  @media (max-width: 374px) { :root { --gutter: 20px; } }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  [tabindex="-1"]:focus { outline: none; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 1.0625rem;      /* 17px */
    line-height: 1.5625rem;    /* 25px */
    -webkit-font-smoothing: antialiased;
  }
  /* One column in normal document flow. It grows with its content and scrolls; nothing is pinned to the screen. */
  .app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding-top: max(var(--gutter), env(safe-area-inset-top));
    padding-bottom: max(var(--gutter), env(safe-area-inset-bottom));
    padding-left: max(var(--gutter), env(safe-area-inset-left));
    padding-right: max(var(--gutter), env(safe-area-inset-right));
  }
  .screen { flex: 1; display: flex; flex-direction: column; gap: 16px; }
  /* Pushes the main action down when there's room; with big text it simply follows the content */
  .push { margin-top: auto; padding-top: 16px; display: flex; flex-direction: column; gap: 12px; }
  /* On Choose the actions sit right under the field, not at the bottom: an iPhone keyboard doesn't resize
     the page, so anything at the bottom would end up behind it */
  .actions { display: flex; flex-direction: column; gap: 4px; }

  h1 {
    font-size: 2rem;           /* 32px */
    line-height: 2.375rem;     /* 38px */
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
    overflow-wrap: break-word;
  }
  /* Very narrow (a phone at 200% zoom, or very large text): the heading eases down a little so a word like
     "intention." still fits on one line instead of breaking before its full stop. It still grows with zoom. */
  h1 { font-size: min(2rem, 9vw + 0.75rem); line-height: 1.19; }
  @media (max-width: 260px) { h1 { font-size: 1.5rem; } }
  p { margin: 0; }
  .body { color: var(--text-2); }
  .support { font-size: 0.875rem; line-height: 1.25rem; color: var(--text-2); }
  .center { text-align: center; }
  .wordmark { font-size: 1.0625rem; font-weight: 600; letter-spacing: 0.01em; margin: 0; }
  a { color: var(--text); text-underline-offset: 2px; }

  button {
    font: inherit;
    font-size: 1.0625rem;
    font-weight: 600;
    min-height: 54px;
    padding: 14px 20px;
    border-radius: var(--radius);
    border: 2px solid transparent;
    cursor: pointer;
    touch-action: manipulation;
    width: 100%;
    text-align: center;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--text);
    background: transparent;
  }
  .primary { background: var(--button); color: var(--button-text); }
  .secondary { border-color: var(--button); }
  /* Text-style buttons still get a 44px+ tap area */
  .link {
    width: auto; min-height: 44px; padding: 10px 12px;
    text-decoration: underline; text-underline-offset: 3px; align-self: center;
  }
  .link.start { align-self: flex-start; margin-left: -12px; }
  .link.inline { display: inline-flex; min-height: 44px; padding: 0 4px; margin: 0; vertical-align: middle; }
  button:focus-visible, a:focus-visible, textarea:focus-visible, input:focus-visible, summary:focus-visible {
    outline: 3px solid var(--button);
    outline-offset: 3px;
  }
  button:disabled { opacity: .55; cursor: default; }

  /* ---------- sunrise ---------- */
  .sunrise { display: block; width: min(200px, 56%); height: auto; margin: 4px 0; }
  .sunrise .disc { fill: var(--sun); }
  .sunrise .ray { stroke: var(--sun); stroke-width: 6; stroke-linecap: round; }
  .sunrise .horizon { stroke: var(--text); stroke-opacity: .28; stroke-width: 2; }

  /* ---------- breathe ---------- */
  .orbwrap { display: grid; place-items: center; padding: 8px 0; min-height: min(220px, 32vh); }
  .orb {
    width: min(200px, 30vh, 60vw);
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle at 45% 40%, #FBEFC4 0%, var(--sun) 62%, #E9C65A 100%);
    transform: scale(.55);
    transition-property: transform;
    transition-timing-function: ease-in-out;
  }
  .orb[data-phase="in"] { transform: scale(1); }
  .orb[data-phase="out"] { transform: scale(.55); }
  .breathcount { font-weight: 600; }
  /* Reduced motion: no growing circle; the words carry the rhythm */
  @media (prefers-reduced-motion: reduce) {
    .orb, .orb[data-phase] { transform: none !important; transition: none !important; width: min(120px, 22vh, 40vw); }
    .orb[data-phase="out"] { opacity: .7; }
  }

  /* ---------- choose ---------- */
  .field { display: flex; flex-direction: column; gap: 8px; }
  .field label { font-weight: 600; }
  textarea {
    font: inherit;
    color: var(--text);
    background: var(--field);
    border: 2px solid var(--field-line);
    border-radius: var(--radius);
    padding: 14px 16px;
    min-height: 3.5rem;
    width: 100%;
    resize: none;
    overflow: hidden;
  }
  textarea::placeholder { color: var(--placeholder); opacity: 1; }
  .msg { font-size: 0.875rem; line-height: 1.25rem; color: var(--text-2); }
  .msg:empty { display: none; }
  .msg.err { color: var(--error); font-weight: 600; }
  .msg.ok { color: var(--text); font-weight: 600; }

  /* ---------- finish / today ---------- */
  .intention {
    background: var(--field);
    border-radius: var(--radius);
    padding: 12px 18px 16px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    border-left: 6px solid var(--sun);
  }
  .intention .text { font-size: 1.25rem; line-height: 1.75rem; font-weight: 600; overflow-wrap: break-word; hyphens: auto; }
  @media (max-width: 260px) { .intention { padding-inline: 14px; } .intention .text { font-size: 1.125rem; line-height: 1.5rem; } }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .row .link { margin-right: -12px; }

  /* Secondary sections on the completed screen: closed by default */
  .more { display: flex; flex-direction: column; margin-top: 8px; border-top: 1px solid var(--rule); }
  .push .more { margin-top: 0; }
  details.section { border-bottom: 1px solid var(--rule); }
  details.section > summary {
    cursor: pointer; list-style: none; min-height: 52px; display: flex; align-items: center; justify-content: space-between;
    font-weight: 600; padding: 12px 0; gap: 12px;
  }
  details.section > summary::-webkit-details-marker { display: none; }
  details.section > summary::after { content: "+"; font-size: 1.4rem; color: var(--text-2); }
  details.section[open] > summary::after { content: "–"; }
  details.section .inner { padding: 0 0 16px; display: flex; flex-direction: column; gap: 12px; font-size: 0.9375rem; line-height: 1.375rem; color: var(--text-2); }
  details.section .inner h3 { font-size: 0.9375rem; color: var(--text); margin: 4px 0 -6px; }
  details.section .inner ul { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; }
  .history { list-style: none; padding: 0 !important; gap: 12px !important; }
  .history li { display: flex; flex-direction: column; gap: 2px; }
  .history .when { font-size: 0.875rem; color: var(--text-2); }
  .history .what { color: var(--text); overflow-wrap: break-word; }
  .myid { display: block; padding: 10px 12px; border: 1px solid var(--field-line); border-radius: 10px; background: var(--field);
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.8125rem; overflow-wrap: anywhere; color: var(--text); }
  input[type="time"], input[type="text"] {
    font: inherit; color: var(--text); background: var(--field); border: 2px solid var(--field-line);
    border-radius: 12px; min-height: 48px; padding: 8px 12px; width: 100%;
  }
  .flabel { font-weight: 600; color: var(--text); margin-bottom: -6px; }
  .isteps { margin: 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: 6px; color: var(--text); }
  .ic { display: inline-grid; place-items: center; width: 22px; height: 22px; vertical-align: -5px; }
  .ic svg { width: 16px; height: 16px; }
  .consent { font-size: 0.875rem; line-height: 1.25rem; color: var(--text-2); }
  .consent summary { cursor: pointer; text-decoration: underline; font-weight: 600; color: var(--text); min-height: 44px; display: flex; align-items: center; }
  .consent ul { margin: 0 0 8px; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; }
</style>

<div class="app">
  <main id="card" class="screen"></main>
  <p class="sr-only" id="announce" aria-live="polite"></p>
</div>
<noscript><p style="padding:24px">Mornward needs JavaScript to run.</p></noscript>

<script>
(() => {
  // ---------- storage (on this phone only) ----------
  const store = {
    // `valid` guards against corrupted or hand-edited storage: anything that fails it reads as the fallback
    get(k, fallback, valid = () => true) {
      try {
        const raw = localStorage.getItem("fl." + k);
        if (raw == null) return fallback;
        const v = JSON.parse(raw);
        return v != null && valid(v) ? v : fallback;
      } catch { return fallback; }
    },
    // Returns whether the write happened (storage can be full, blocked, or off in a private window)
    set(k, v) { try { localStorage.setItem("fl." + k, JSON.stringify(v)); return true; } catch { return false; } },
    del(k) { try { localStorage.removeItem("fl." + k); return true; } catch { return false; } },
    keys() { try { return Object.keys(localStorage).filter((k) => k.startsWith("fl.")).map((k) => k.slice(3)); } catch { return []; } }
  };

  // Days are the phone's local calendar date. A routine belongs to the date it started on.
  const dayKey = (d = new Date()) =>
    d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const isDay = (v) => typeof v === "string" && /^\d{4}-\d{2}-\d{2}$/.test(v);
  // Adds whole calendar days (not 24-hour blocks, so daylight saving can't skip a day)
  const addDays = (key, n) => {
    const [y, m, d] = key.split("-").map(Number);
    return dayKey(new Date(y, m - 1, d + n));
  };
  const fmtDay = (key) => {
    const [y, m, d] = key.split("-").map(Number);
    const opts = { weekday: "long", month: "long", day: "numeric" };
    if (y !== new Date().getFullYear()) opts.year = "numeric";
    return new Date(y, m - 1, d).toLocaleDateString([], opts);
  };
  const isText = (v) => typeof v === "string";
  const isLetter = (v) => typeof v === "object" && typeof v.text === "string" && typeof v.forDay === "string";

  // ---------- the routine ----------
  // Breathing pace: one breath is a full in and out. No holds.
  const BREATH = { inMs: 4000, outMs: 6000, count: 3 };
  const MAX_INTENTION = 200;
  // A routine started shortly before midnight can still be finished after it
  const CARRY_OVER_MS = 3 * 3600e3;

  // { day, run, phase: breathe|choose|finish|done, breaths, breathing, intention, startedAt }
  const PHASES = ["breathe", "choose", "finish", "done"];
  const isRoutine = (v) => typeof v === "object" && isDay(v.day) && PHASES.includes(v.phase) && Number.isInteger(v.run);
  let routine = store.get("routine", null, isRoutine);
  const saveRoutine = () => store.set("routine", routine);

  // Intentions keep the earlier version's key ("intent:YYYY-MM-DD"), so old ones show up, dated
  const intentKey = (day) => "intent:" + day;
  const draftKey = (day) => "draft:" + day;
  const intentionFor = (day) => {
    const t = store.get(intentKey(day), "", isText).trim();
    return t || store.get("practice-intent:" + day, "", isText).trim();
  };
  // Counts as saved only if the phone confirms it: written, then read back
  function saveIntention(day, text) {
    if (!text) return false;
    if (!store.set(intentKey(day), text)) return false;
    return store.get(intentKey(day), null, isText) === text;
  }
  const cleanIntention = (raw) => raw.replace(/\s+/g, " ").trim().slice(0, MAX_INTENTION);

  // ---------- anonymous stats (Supabase) ----------
  // What's sent: a random device id, the day, which steps of the routine happened, and the app version.
  // Never sent: the intention, or anything else anyone writes.
  // The publishable key is meant to be public; the database only lets it ADD rows to one table.
  const STATS = {
    url: "https://cnwwyucolebrcbydbfej.supabase.co/rest/v1/events",
    key: "sb_publishable_XpdHaGbjKX5CC0LRYiWBxQ_O8xO2oCs",
    version: "beta-4"
  };
  // Where questions and data requests go (also on terms.html)
  const CONTACT = "mornward@proton.me";
  // Bump TERMS_VERSION when the wording changes in a way people should see again.
  // beta-2: contact, US storage consent, retention and data rights (Thailand PDPA)
  // beta-3: also counted which onboarding screens a new person reached
  // beta-4: the one-minute routine; counts its steps instead (see supabase/ANALYTICS.md)
  const TERMS_VERSION = "beta-4";
  const hasAgreed = () => {
    const a = store.get("agreed", null, (v) => typeof v === "object");
    return !!a && a.version === TERMS_VERSION;
  };
  const statsOn = () => hasAgreed() && store.get("noStats", false) !== true;
  // Keep in sync with terms.html
  const COUNTED = `<ul>
      <li>A random ID made on this phone, not linked to your name, email or any account.</li>
      <li>The date, and which steps happened: started, breathing finished or skipped, intention saved or skipped, finished.</li>
      <li>Whether you opened it from the home screen, and which link you came from (like "reddit"), if the link says so.</li>
    </ul>`;
  const NOT_SENT = `<ul>
      <li>Your intention, or anything else you write. Not a single word.</li>
      <li>Your name, email, phone number, location, contacts or other apps.</li>
      <li>Anything at all once you turn the counts off.</li>
    </ul>`;

  function deviceId() {
    let id = store.get("deviceId", null, (v) => typeof v === "string" && /^[0-9a-f-]{36}$/.test(v));
    if (!id) {
      id = crypto.randomUUID ? crypto.randomUUID()
        : "10000000-1000-4000-8000-100000000000".replace(/[018]/g, (c) =>
          (c ^ (crypto.getRandomValues(new Uint8Array(1))[0] & (15 >> (c / 4)))).toString(16));
      store.set("deviceId", id);
    }
    return id;
  }
  let flushing = false;
  // "viewbox" held screen views from the previous version; anything still waiting there is sent once
  const QUEUES = ["outbox", "viewbox"];
  async function flushStats() {
    if (flushing || !statsOn() || !navigator.onLine) return;
    flushing = true;
    let again = false;
    for (const q of QUEUES) {
      const rows = store.get(q, [], Array.isArray);
      if (!rows.length) continue;
      try {
        const res = await fetch(STATS.url, {
          method: "POST",
          keepalive: true,
          headers: { apikey: STATS.key, "Content-Type": "application/json", Prefer: "return=minimal" },
          body: JSON.stringify(rows)
        });
        // Sent, or rejected for good (bad data): either way don't retry these rows forever
        if (res.ok || (res.status >= 400 && res.status < 500 && res.status !== 408 && res.status !== 429)) {
          const now = store.get(q, [], Array.isArray).slice(rows.length);
          store.set(q, now);
          // Rows queued while this request was out go now, not on the next visit
          if (now.length) again = true;
        }
      } catch { /* offline or blocked: keep them for next time */ }
    }
    flushing = false;
    if (again) flushStats();
  }
  const onHomeScreen = navigator.standalone === true || window.matchMedia("(display-mode: standalone)").matches;
  // Your own test devices: open mornward.app/?test=1 once on each (?test=0 undoes it). Their rows say test: true.
  (() => {
    const t = new URLSearchParams(location.search).get("test");
    if (t === "1") store.set("test", true);
    if (t === "0") store.del("test");
  })();
  // Each step is counted once per routine, however often the screen redraws, the page reloads or a send retries.
  // The key is the routine's day and run number, so a second routine on the same day is its own run.
  function emit(kind, data = {}) {
    if (!statsOn() || !routine) return;
    const key = `${routine.day}#${routine.run}#${kind}`;
    const sent = store.get("sent", [], Array.isArray);
    if (sent.includes(key)) return;
    store.set("sent", sent.concat([key]).slice(-60));
    const row = { device_id: deviceId(), day: routine.day, kind,
      data: { run: routine.run, home_screen: onHomeScreen, ...(store.get("test", false) === true ? { test: true } : {}), ...data },
      app_version: STATS.version };
    store.set("outbox", store.get("outbox", [], Array.isArray).concat([row]).slice(-50));
    flushStats();
  }
  window.addEventListener("online", flushStats);

  // ---------- helpers ----------
  const $ = (s, r = document) => r.querySelector(s);
  const card = $("#card");
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const ua = navigator.userAgent;
  const isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const isAndroid = /Android/.test(ua);

  // The next screen's main button sits where the last one was, so the second half of a sleepy double-tap
  // would press it. Swallow clicks for a short moment after every screen change.
  let tapGuardUntil = 0;
  const guardTaps = () => { tapGuardUntil = performance.now() + 500; };
  document.addEventListener("click", (e) => {
    if (performance.now() < tapGuardUntil) { e.preventDefault(); e.stopPropagation(); }
  }, true);
  // After a screen change, tell screen readers where they are and move focus to the new heading.
  // Skipped on the very first screen, so opening the app doesn't jump focus.
  let screensShown = 0;
  function show(html, label) {
    stopBreathing();
    guardTaps();
    card.innerHTML = html;
    window.scrollTo(0, 0);
    if (screensShown++ === 0) return;
    $("#announce").textContent = label;
    const h = card.querySelector("h1");
    if (h) { h.setAttribute("tabindex", "-1"); h.focus({ preventScroll: true }); }
  }

  // A sun on the horizon (rising) or above it (risen). Decorative.
  function SUN(risen) {
    const cy = risen ? 60 : 96, r = risen ? 26 : 40;
    const rays = [-60, -30, 0, 30, 60].map((a) => {
      const t = (a - 90) * Math.PI / 180, p = (d) => `${(120 + Math.cos(t) * d).toFixed(1)},${(cy + Math.sin(t) * d).toFixed(1)}`;
      const [x1, y1] = p(r + 10).split(","), [x2, y2] = p(r + 22).split(",");
      return `<line class="ray" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
    }).join("");
    return `<svg class="sunrise" viewBox="0 0 240 104" aria-hidden="true" focusable="false">
      <defs><clipPath id="sky${risen ? 1 : 0}"><rect width="240" height="95"/></clipPath></defs>
      <g clip-path="url(#sky${risen ? 1 : 0})"><circle class="disc" cx="120" cy="${cy}" r="${r}"/>${rays}</g>
      <line class="horizon" x1="8" y1="96" x2="232" y2="96"/>
    </svg>`;
  }

  // ---------- 1. Begin ----------
  function renderBegin() {
    const agreed = hasAgreed();
    show(`
      <p class="wordmark">mornward</p>
      ${SUN(false)}
      <h1>Before the scroll,<br>one clear intention.</h1>
      <p class="body">Three breaths. Choose what matters.<br>Then get on with your morning.</p>
      <div class="push">
        <button class="primary" id="begin" type="button">Begin</button>
        <p class="support center">About one minute</p>
        ${agreed ? "" : `<div class="consent" id="consent">
          <p>Free, no account. What you write stays on this phone. By tapping Begin you agree to the
            <a href="terms.html" target="_blank" rel="noopener">beta terms</a>, including anonymous usage counts.</p>
          <details><summary>What's counted</summary>${COUNTED}<p><b>Never sent:</b></p>${NOT_SENT}
            <p>Stored on Supabase in the United States and deleted within 90 days after the beta. You can turn the counts
            off after your first routine. Questions: <a href="mailto:${CONTACT}">${CONTACT}</a></p></details>
        </div>`}
        ${earlierSection(dayKey()) ? `<div class="more">${earlierSection(dayKey())}</div>` : ""}
      </div>`, "Mornward. Before the scroll, one clear intention.");
    $("#begin").onclick = begin;
  }
  function begin() {
    if (!hasAgreed()) store.set("agreed", { version: TERMS_VERSION, on: dayKey(), how: "begin" });
    const today = dayKey();
    const first = store.get("everStarted", false) !== true;
    const run = routine && routine.day === today ? routine.run + 1 : 1;
    routine = { day: today, run, phase: "breathe", breaths: 0, breathing: null, intention: null, startedAt: Date.now() };
    saveRoutine();
    store.set("everStarted", true);
    emit("routine_started", { ...(viaCalendar ? { via: "calendar" } : {}), ...(first ? { first: true, from: store.get("from", null) } : {}) });
    renderBreathe(false);
  }

  // ---------- 2. Breathe ----------
  // The timer keeps its remaining time, so Pause stops exactly where the breath was.
  let br = null; // { phase: "in"|"out", left, at, timer, paused }
  function stopBreathing() {
    if (br && br.timer) clearTimeout(br.timer);
    br = null;
  }
  const breathLabel = () => `Breath ${Math.min(routine.breaths + 1, BREATH.count)} of ${BREATH.count}`;
  function renderBreathe(paused) {
    show(`
      <p class="breathcount" id="bcount">${breathLabel()}</p>
      <h1 id="bword">${paused ? "Paused" : "Breathe in"}</h1>
      <p class="body">At your own pace</p>
      <div class="orbwrap"><div class="orb" id="orb" aria-hidden="true"></div></div>
      <p class="sr-only" id="bstatus" role="status"></p>
      <div class="push">
        <button class="primary" id="bpause" type="button">${paused ? "Resume" : "Pause"}</button>
        <button class="link" id="bskip" type="button">Skip breathing</button>
      </div>`, `Breathing. ${breathLabel()}.`);
    br = { phase: "in", left: BREATH.inMs, at: 0, timer: 0, paused: true };
    $("#bpause").onclick = () => (br && br.paused ? resumeBreathing() : pauseBreathing());
    $("#bskip").onclick = () => {
      const breathsDone = routine.breaths;
      routine.breathing = "skipped";
      routine.phase = "choose";
      saveRoutine();
      emit("breathing_skipped", { breaths_done: breathsDone });
      renderChoose();
    };
    if (paused) $("#bstatus").textContent = "Paused.";
    else resumeBreathing();
  }
  function setPhase(phase, ms) {
    const orb = $("#orb");
    br.phase = phase; br.left = ms; br.at = performance.now();
    $("#bword").textContent = phase === "in" ? "Breathe in" : "Breathe out";
    if (orb) {
      orb.style.transform = "";
      orb.style.transitionDuration = ms + "ms";
      orb.dataset.phase = phase;
    }
    br.timer = setTimeout(phaseDone, ms);
  }
  function phaseDone() {
    if (!br) return;
    if (br.phase === "in") { setPhase("out", BREATH.outMs); return; }
    routine.breaths += 1;
    saveRoutine();
    if (routine.breaths >= BREATH.count) {
      routine.breathing = "completed";
      routine.phase = "choose";
      saveRoutine();
      emit("breathing_completed");
      renderChoose();
      return;
    }
    // Screen readers hear the breath number once per breath, not every in and out
    $("#bcount").textContent = breathLabel();
    $("#bstatus").textContent = breathLabel();
    setPhase("in", BREATH.inMs);
  }
  function pauseBreathing() {
    if (!br || br.paused) return;
    clearTimeout(br.timer);
    br.left = Math.max(0, br.left - (performance.now() - br.at));
    br.paused = true;
    const orb = $("#orb");
    if (orb) { orb.style.transform = getComputedStyle(orb).transform; orb.style.transitionDuration = "0ms"; }
    $("#bword").textContent = "Paused";
    $("#bpause").textContent = "Resume";
    $("#bstatus").textContent = "Paused.";
  }
  function resumeBreathing() {
    if (!br || !br.paused) return;
    br.paused = false;
    $("#bpause").textContent = "Pause";
    $("#bstatus").textContent = "";
    const orb = $("#orb");
    if (orb && orb.dataset.phase) {
      // Carry on with the same breath from where it stopped
      $("#bword").textContent = br.phase === "in" ? "Breathe in" : "Breathe out";
      void orb.offsetWidth;
      orb.style.transitionDuration = br.left + "ms";
      orb.style.transform = "";
      br.at = performance.now();
      br.timer = setTimeout(phaseDone, br.left);
    } else {
      // First start: draw the circle small, then let it grow
      if (orb) void orb.offsetWidth;
      setPhase("in", BREATH.inMs);
    }
  }
  // Pause when the phone locks or another app comes to the front
  document.addEventListener("visibilitychange", () => { if (document.hidden) pauseBreathing(); });

  // ---------- 3. Choose ----------
  // editing: changing (or adding) an intention after the routine; `back` draws the screen to return to
  function renderChoose(editing = false, back = null) {
    const day = routine.day;
    const saved = intentionFor(day);
    const draft = store.get(draftKey(day), null, isText);
    const value = draft !== null && draft.trim() ? draft : saved;
    show(`
      <h1>What matters<br>this morning?</h1>
      <p class="body">Choose one small thing.</p>
      <div class="field">
        <label for="intent">My intention</label>
        <textarea id="intent" rows="1" maxlength="${MAX_INTENTION}" enterkeyhint="done" autocomplete="off"
          autocapitalize="sentences" placeholder="Something small is enough" aria-describedby="imsg">${esc(value)}</textarea>
        <p class="msg" id="imsg" role="status"></p>
      </div>
      <div class="actions">
        <button class="primary" id="isave" type="button">Save my intention</button>
        <button class="link" id="iskip" type="button">${editing ? "Keep it as it was" : "Skip for today"}</button>
      </div>`, editing ? "Edit your intention" : "What matters this morning?");
    const field = $("#intent");
    const msg = (t, err = false) => { $("#imsg").textContent = t; $("#imsg").className = "msg" + (err ? " err" : ""); };
    const grow = () => { field.style.height = "auto"; field.style.height = field.scrollHeight + 4 + "px"; };
    grow();
    field.addEventListener("input", () => {
      grow();
      // Drafts are kept as you type, so a reload, a call or a closed tab doesn't lose them
      const kept = store.set(draftKey(day), field.value);
      if (!kept) msg("This phone isn't saving drafts right now. Keep this page open.", true);
      else if ($("#imsg").classList.contains("err")) msg("");
    });
    field.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); save(); } });
    // Keep the field and its button above the keyboard once it opens
    field.addEventListener("focus", () => setTimeout(() => { const b = $("#isave"); if (b) b.scrollIntoView({ block: "nearest" }); }, 350));
    if (window.visualViewport) {
      const keep = () => { if (document.activeElement === field) { const b = $("#isave"); if (b) b.scrollIntoView({ block: "nearest" }); } };
      window.visualViewport.addEventListener("resize", keep);
    }
    const save = () => {
      const text = cleanIntention(field.value);
      if (!text) { msg("Write a few words first, or skip for today.", true); field.focus(); return; }
      if (!saveIntention(day, text)) {
        store.set(draftKey(day), field.value);
        msg("Couldn't save it on this phone. Your words are still here. Try again.", true);
        return;
      }
      store.del(draftKey(day));
      const firstSave = routine.intention !== "saved";
      routine.intention = "saved";
      if (routine.phase === "choose") routine.phase = "finish";
      saveRoutine();
      if (firstSave) {
        emit("intention_saved");
        if (routine.breathing === "completed") emit("core_routine_completed");
      }
      if (editing && back) back("Saved.");
      else renderFinish();
    };
    $("#isave").onclick = save;
    $("#iskip").onclick = () => {
      if (editing && back) { store.del(draftKey(day)); back(""); return; }
      // Skipping never removes something already written today
      if (routine.intention !== "saved") routine.intention = saved ? "saved" : "skipped";
      routine.phase = "finish";
      saveRoutine();
      if (!saved) emit("intention_skipped");
      renderFinish();
    };
  }

  // ---------- 4. Finish ----------
  function intentionBlock(text, label) {
    return `<div class="intention">
        <div class="row"><span class="support">${label}</span>
          <button class="link" id="iedit" type="button" aria-label="Edit your intention">Edit</button></div>
        <p class="text" id="itext">${esc(text)}</p>
      </div>`;
  }
  function renderFinish(note = "") {
    const text = intentionFor(routine.day);
    show(`
      ${SUN(true)}
      <h1>You're ready.</h1>
      ${text ? `${intentionBlock(text, "Your intention")}
        <p class="body">Take it into your day.</p>`
      : `<p class="body">No intention today. You can still add one later.</p>
        <button class="link start" id="iadd" type="button">Add an intention</button>`}
      <p class="msg ok" role="status">${esc(note)}</p>
      <div class="push">
        <button class="primary" id="finish" type="button">Finish</button>
      </div>`, "You're ready.");
    emit("routine_finished", { breathing: routine.breathing || "skipped", intention: text ? "saved" : "skipped",
      seconds: Math.round((Date.now() - routine.startedAt) / 1000) });
    ($("#iedit") || $("#iadd")).onclick = () => renderChoose(true, renderFinish);
    $("#finish").onclick = () => {
      routine.phase = "done";
      saveRoutine();
      renderToday();
    };
  }

  // ---------- completed for today (also what a same-day reopen shows) ----------
  function renderToday(note = "") {
    if (!routine || routine.day !== dayKey()) { renderBegin(); return; }
    const text = intentionFor(routine.day);
    show(`
      <p class="wordmark">mornward</p>
      <p class="support">${esc(fmtDay(routine.day))}</p>
      <h1>${text ? "Today's intention" : "Done for today"}</h1>
      ${text ? `${intentionBlock(text, "Today")}<p class="body">Take it into your day.</p>`
      : `<p class="body">You did the routine without an intention today.</p>
        <button class="link start" id="iadd" type="button">Add an intention</button>`}
      <p class="msg ok" role="status">${esc(note)}</p>
      <button class="link start" id="again" type="button">Do the routine again</button>
      <div class="more">
        ${earlierSection(routine.day)}
        ${homeSection()}
        ${reminderSection()}
        ${privacySection()}
      </div>`, text ? "Today's intention" : "Done for today");
    ($("#iedit") || $("#iadd")).onclick = () => renderChoose(true, renderToday);
    $("#again").onclick = begin;
    wireHome();
    wireReminder();
    wirePrivacy();
  }

  // ---------- earlier intentions: always dated, never shown as today's ----------
  function earlierEntries(today) {
    const byDay = new Map();
    // Real ones first, so a practice entry never replaces one from the same day
    const keys = store.keys().sort((a, b) => a.startsWith("practice-") - b.startsWith("practice-"));
    for (const k of keys) {
      const m = k.match(/^(practice-)?intent:(\d{4}-\d{2}-\d{2})$/);
      if (!m || m[2] === today || byDay.has(m[2])) continue;
      const t = store.get(k, "", isText).trim();
      if (t) byDay.set(m[2], t);
    }
    return [...byDay].sort((a, b) => (a[0] < b[0] ? 1 : -1)).slice(0, 60);
  }
  function earlierSection(today) {
    const items = earlierEntries(today);
    const letter = store.get("letter", null, isLetter);
    const note = letter && letter.text.trim() ? letter : null;
    if (!items.length && !note) return "";
    return `<details class="section" id="earlier">
        <summary>Earlier intentions</summary>
        <div class="inner"><ul class="history">
          ${items.map(([d, t]) => `<li><span class="when">${esc(fmtDay(d))}</span><span class="what">${esc(t)}</span></li>`).join("")}
          ${note ? `<li><span class="when">A note you wrote${isDay(note.writtenOn) ? " on " + esc(fmtDay(note.writtenOn)) : ""}</span><span class="what">${esc(note.text)}</span></li>` : ""}
        </ul></div>
      </details>`;
  }

  // ---------- adding Mornward to the home screen (on the completed screen only, never on Finish) ----------
  // Browsers that support it (Chrome on Android, mostly) fire beforeinstallprompt, sometimes seconds after load.
  // The saved event can be shown once, only from a tap. "Accepted" means the person said yes to the prompt;
  // only appinstalled (or opening from the icon) confirms it's actually on the home screen.
  let installPrompt = null, installBusy = false, installAccepted = false, installNote = "", installed = false, installOpen = false;
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    if (installed) return;
    installPrompt = e;
    refreshHome();
  });
  window.addEventListener("appinstalled", () => {
    installed = true; installPrompt = null; installAccepted = false; installNote = "";
    refreshHome();
  });
  // Browser detection is best effort: Instagram, Facebook, TikTok and others name themselves; Reddit often doesn't
  const inAppBrowser = /Instagram|FBAN|FBAV|FB_IAB|TikTok|musical_ly|Snapchat|Line\/|Twitter|LinkedInApp|reddit/i.test(ua);
  const iosVersion = (() => { const m = ua.match(/Version\/(\d+)/); return m ? Number(m[1]) : 0; })();
  function browserKind() {
    if (inAppBrowser) return "inapp";
    if (isIOS) return /CriOS/.test(ua) ? "ios-chrome" : /FxiOS|EdgiOS|OPiOS|GSA\//.test(ua) ? "ios-other" : "ios-safari";
    if (isAndroid) {
      if (/SamsungBrowser/.test(ua)) return "samsung";
      if (/Firefox/.test(ua)) return "android-firefox";
      if (/EdgA|OPR\/|YaBrowser|UCBrowser|MiuiBrowser|HuaweiBrowser|Brave/.test(ua)) return "android-other";
      return /Chrome\//.test(ua) ? "android-chrome" : "android-other";
    }
    return "computer";
  }
  const IC_SHARE = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>`;
  const share = `<span class="ic" role="img" aria-label="Share">${IC_SHARE}</span>`;
  function installStepsList() {
    const main = isIOS ? "Safari" : "Chrome";
    const steps = {
      "inapp": [`Tap <b>⋯</b> or <b>⋮</b> in this app's corner`, `Choose <b>Open in browser</b> (or <b>Open in ${main}</b>)`, `Add it to your home screen from there`],
      "ios-safari": iosVersion >= 26
        ? [`Tap <b>⋯</b> next to the address bar`, `Tap ${share} <b>Share</b>`, `Tap <b>Add to Home Screen</b>, then <b>Add</b>`]
        : [`Tap ${share} <b>Share</b>`, `Scroll and tap <b>Add to Home Screen</b>`, `Tap <b>Add</b>`],
      "ios-chrome": [`Tap ${share} <b>Share</b> in the address bar`, `Tap <b>Add to Home Screen</b>`, `Tap <b>Add</b>`],
      "ios-other": [`Open this page in <b>Safari</b>`, `Tap ${share} <b>Share</b> → <b>Add to Home Screen</b>`],
      "android-chrome": [`Tap <b>⋮</b> at the top right`, `Tap <b>Add to home screen</b>`, `Tap <b>Install</b> (or <b>Add</b>)`],
      "samsung": [`Tap <b>☰</b> at the bottom`, `Tap <b>Add page to</b>`, `Tap <b>Home screen</b>`],
      "android-firefox": [`Tap <b>⋮</b>`, `Look for <b>Add to Home screen</b> or <b>Install</b>`],
      "android-other": [`Open your browser's menu`, `Look for <b>Add to Home screen</b> or <b>Install</b>`],
      "computer": [`Open <b>mornward.app</b> on your phone`, `Add it to the home screen there`],
    }[browserKind()];
    return `<ol class="isteps">${steps.map((t) => `<li>${t}</li>`).join("")}</ol>`;
  }
  const installState = () => (onHomeScreen ? "home" : installed ? "installed" : installAccepted ? "accepted"
    : installPrompt ? "prompt" : "manual");
  function homeBody() {
    const st = installState();
    if (st === "home" || st === "installed") return `<p role="status">Mornward is on your home screen.</p>`;
    if (st === "accepted") return `<p role="status">Adding it now. Look for the Mornward sun on your home screen.</p>`;
    const note = installNote ? `<p role="status">${installNote}</p>` : "";
    const intro = `<p>Open it from an icon tomorrow instead of looking for this page.</p>${note}`;
    if (st === "prompt") return `${intro}<button class="secondary" data-install-go type="button">Add to home screen</button>`;
    return `${intro}
      <button class="secondary" data-install-how aria-expanded="${installOpen}" aria-controls="isteps" type="button">Show me how</button>
      <div id="isteps"${installOpen ? "" : " hidden"}>
        ${installStepsList()}
        <p style="margin-top:10px">Can't find it? You may be inside another app's browser. Open this page in Safari (iPhone) or Chrome (Android).</p>
        <button class="link start" type="button" data-copy-link>Copy link</button>
        <input type="text" readonly aria-label="Link to Mornward" data-link-field hidden>
        <p role="status" data-copy-msg></p>
      </div>`;
  }
  const homeSection = () => `<details class="section" id="homeSec"><summary>Add to home screen</summary><div class="inner" id="homeBox">${homeBody()}</div></details>`;
  function refreshHome() {
    const box = $("#homeBox");
    if (!box) return;
    box.innerHTML = homeBody();
    wireHome();
  }
  function wireHome() {
    const box = $("#homeBox");
    if (!box) return;
    const go = box.querySelector("[data-install-go]");
    if (go) go.onclick = async () => {
      if (installBusy || !installPrompt) return;
      installBusy = true;
      go.disabled = true;
      const ask = installPrompt;
      installPrompt = null; // a prompt can only be shown once
      try {
        await ask.prompt();
        const choice = await ask.userChoice;
        if (choice && choice.outcome === "accepted") { installAccepted = true; installNote = ""; }
        else { installNote = "No problem. You can add it later from your browser's menu:"; installOpen = true; }
      } catch {
        installNote = "That didn't open. You can add it from your browser's menu instead:"; installOpen = true;
      }
      installBusy = false;
      refreshHome();
    };
    const how = box.querySelector("[data-install-how]");
    if (how) how.onclick = () => {
      installOpen = !installOpen;
      if (installOpen) prepareIconStart(true);
      refreshHome();
      const again = $("#homeBox [data-install-how]");
      if (again) again.focus();
    };
    const copy = box.querySelector("[data-copy-link]");
    if (copy) copy.onclick = async () => {
      const url = shareUrl();
      const msg = box.querySelector("[data-copy-msg]");
      try {
        await navigator.clipboard.writeText(url);
        msg.textContent = "Copied. Paste it into Safari or Chrome.";
      } catch {
        const f = box.querySelector("[data-link-field]");
        f.value = url; f.hidden = false; f.focus(); f.select();
        msg.textContent = "Copy this link, then paste it into Safari or Chrome.";
      }
    };
  }

  // ---------- an optional calendar reminder ----------
  // Mornward can't send notifications and never asks for permission. This hands a daily event to the person's
  // own calendar. It can't tell whether they saved it, so it never says the reminder is set, and isn't counted.
  const REMIND_DAYS = 7;
  const pad2 = (n) => String(n).padStart(2, "0");
  const isAlarmTime = (v) => typeof v === "string" && /^([01]\d|2[0-3]):[0-5]\d$/.test(v);
  function nextAlarm(v) {
    const [h, m] = v.split(":").map(Number);
    const d = new Date();
    d.setHours(h, m, 0, 0);
    if (d <= new Date()) d.setDate(d.getDate() + 1);
    return d;
  }
  const icsLocal = (d) => `${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}T${pad2(d.getHours())}${pad2(d.getMinutes())}00`;
  const REMIND_TITLE = "Mornward: three breaths, one intention";
  // The link carries this phone's anonymous ID and choices after "#", which never reaches a server. A page opened
  // inside Reddit or Instagram keeps its own storage; without this the reminder would open as a new person.
  function carryState() {
    const r = { v: 1, i: deviceId(), a: store.get("alarmAt", null, isAlarmTime), f: store.get("from", null),
      t: hasAgreed() ? TERMS_VERSION : null, s: store.get("noStats", false) === true ? 1 : 0 };
    return encodeURIComponent(JSON.stringify(r));
  }
  const carryLink = () => "https://mornward.app/?via=calendar#r=" + carryState();
  const reminderText = (link) => `Before the scroll: ${link}\nThree breaths, one intention. About a minute.`;
  const icsEsc = (t) => t.replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
  // Calendar files want lines of at most 75 bytes; longer ones continue on the next line after a space
  const icsFold = (line) => {
    const out = []; let cur = "", bytes = 0;
    for (const ch of line) {
      const b = new TextEncoder().encode(ch).length;
      if (bytes + b > (out.length ? 74 : 75)) { out.push(cur); cur = ""; bytes = 0; }
      cur += ch; bytes += b;
    }
    out.push(cur);
    return out.join("\r\n ");
  };
  function calendarFile(v, link) {
    const start = nextAlarm(v);
    const now = new Date();
    const stamp = `${now.getUTCFullYear()}${pad2(now.getUTCMonth() + 1)}${pad2(now.getUTCDate())}T${pad2(now.getUTCHours())}${pad2(now.getUTCMinutes())}00Z`;
    return ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Mornward//EN", "CALSCALE:GREGORIAN", "BEGIN:VEVENT",
      `UID:${Date.now().toString(36)}${Math.random().toString(36).slice(2, 8)}@mornward.app`,
      `DTSTAMP:${stamp}`, `DTSTART:${icsLocal(start)}`, "DURATION:PT5M", `RRULE:FREQ=DAILY;COUNT=${REMIND_DAYS}`,
      `SUMMARY:${icsEsc(REMIND_TITLE)}`, `DESCRIPTION:${icsEsc(reminderText(link))}`, `URL:${link}`,
      "BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${icsEsc("Before the scroll: one clear intention")}`, "TRIGGER:PT0M", "END:VALARM",
      "END:VEVENT", "END:VCALENDAR"].map(icsFold).join("\r\n") + "\r\n";
  }
  function googleCalendarLink(v, link) {
    const start = nextAlarm(v);
    const end = new Date(start.getTime() + 5 * 60000);
    const q = new URLSearchParams({ action: "TEMPLATE", text: REMIND_TITLE, details: reminderText(link),
      dates: `${icsLocal(start)}/${icsLocal(end)}`, recur: `RRULE:FREQ=DAILY;COUNT=${REMIND_DAYS}` });
    try { q.set("ctz", Intl.DateTimeFormat().resolvedOptions().timeZone); } catch {}
    return "https://calendar.google.com/calendar/render?" + q.toString();
  }
  function reminderSection() {
    const at = store.get("alarmAt", "", isAlarmTime) || "07:00";
    return `<details class="section" id="remindSec"><summary>Calendar reminder</summary><div class="inner">
        <p>Mornward doesn't send notifications. This adds an event to your own calendar for the next ${REMIND_DAYS} mornings.</p>
        <label class="flabel" for="remAt">Time</label>
        <input type="time" id="remAt" value="${esc(at)}">
        <button class="secondary" id="remGo" type="button">${isIOS ? "Add to Calendar" : "Add to Google Calendar"}</button>
        <button class="link start" id="remAlt" type="button">${isIOS ? "Use Google Calendar instead" : "Download a calendar file instead"}</button>
        <p role="status" id="remMsg"></p>
      </div></details>`;
  }
  function wireReminder() {
    if (!$("#remGo")) return;
    const remind = (google) => {
      const v = $("#remAt").value;
      if (!isAlarmTime(v)) { $("#remMsg").textContent = "Pick a time first."; $("#remAt").focus(); return; }
      store.set("alarmAt", v);
      const link = carryLink();
      if (google) window.open(googleCalendarLink(v, link), "_blank", "noopener");
      else {
        const a = document.createElement("a");
        a.href = "data:text/calendar;charset=utf-8," + encodeURIComponent(calendarFile(v, link));
        a.download = "mornward.ics";
        document.body.appendChild(a); a.click(); a.remove();
      }
      // We can only hand it over, not confirm it was saved
      $("#remMsg").textContent = google ? "Google Calendar opened. Save the event there to keep it."
        : isIOS ? "Tap Add to Calendar on the next screen. If a file downloaded instead, open it from Downloads."
        : "Open the downloaded file to add it to your calendar.";
    };
    $("#remGo").onclick = () => remind(!isIOS);
    $("#remAlt").onclick = () => remind(isIOS);
  }

  // ---------- privacy and your data ----------
  function privacySection() {
    const id = store.get("deviceId", null, (v) => typeof v === "string" && /^[0-9a-f-]{36}$/.test(v));
    const ask = id ? `mailto:${CONTACT}?subject=${encodeURIComponent("Delete my Mornward data")}&body=${
      encodeURIComponent("Please delete the stats for this ID: " + id)}` : "";
    return `<details class="section" id="privSec"><summary>Privacy and your data</summary><div class="inner">
        <p>Your intentions are saved only in this browser on this phone. Clearing browser data deletes them.</p>
        <p id="statsLine"></p>
        <h3>What's counted</h3>${COUNTED}
        <h3>What's never sent</h3>${NOT_SENT}
        <p>Stored on Supabase in the United States, never sold or used for ads, deleted within 90 days after the beta ends.
          <a href="terms.html" target="_blank" rel="noopener">Full terms</a></p>
        ${id ? `<p>Your anonymous ID:</p><code class="myid" id="myId">${esc(id)}</code>
          <p>To see or delete the stats sent with it, email it to <a href="${ask}">${CONTACT}</a>. Handled within 30 days.</p>`
        : `<p>No stats have been sent from this phone.</p>`}
        <button class="link start" type="button" id="wipeLocal">Delete everything on this phone</button>
      </div></details>`;
  }
  function wirePrivacy() {
    const draw = () => {
      $("#statsLine").innerHTML = statsOn()
        ? `Anonymous counts are on. <button class="link inline" type="button" id="statsToggle">Turn off</button>`
        : `Anonymous counts are off. <button class="link inline" type="button" id="statsToggle">Turn back on</button>`;
      $("#statsToggle").onclick = () => {
        if (statsOn()) { store.set("noStats", true); store.set("outbox", []); store.set("viewbox", []); }
        else store.set("noStats", false);
        draw();
      };
    };
    draw();
    $("#wipeLocal").onclick = () => {
      const id = store.get("deviceId", null);
      const msg = "This deletes your intentions and settings on this phone. It can't be undone." +
        (id ? "\n\nIf you also want your stats deleted, email your ID first." : "");
      if (!confirm(msg)) return;
      store.keys().forEach((k) => store.del(k));
      location.reload();
    };
  }

  // ---------- arriving from a reminder, a link, or the iPhone home-screen icon ----------
  const viaCalendar = new URLSearchParams(location.search).get("via") === "calendar";
  // The reminder link carries the anonymous ID and choices. A browser that has never seen Mornward (the first
  // visit happened inside another app's browser) takes them, so the same person isn't counted twice.
  (() => {
    const m = location.hash.match(/^#r=(.+)$/);
    if (!m) return;
    try { history.replaceState(null, "", location.pathname + location.search); } catch {}
    if (store.get("deviceId", null) !== null) return;
    let r;
    try { r = JSON.parse(decodeURIComponent(m[1])); } catch { return; }
    if (!r || typeof r !== "object" || r.v !== 1) return;
    if (typeof r.i === "string" && /^[0-9a-f-]{36}$/.test(r.i)) { store.set("deviceId", r.i); store.set("everStarted", true); }
    if (r.t === TERMS_VERSION) store.set("agreed", { version: TERMS_VERSION, on: dayKey(), how: "carried" });
    if (r.s === 1) store.set("noStats", true);
    if (isAlarmTime(r.a)) store.set("alarmAt", r.a);
    if (typeof r.f === "string" && /^[a-z0-9-]{1,20}$/.test(r.f)) store.set("from", r.f);
    // Links from the previous version could carry a note; keep it, dated
    if (typeof r.n === "string" && r.n.trim() && isDay(r.nd) && !store.get("letter", null, isLetter))
      store.set("letter", { text: r.n.slice(0, 200), forDay: r.nd, writtenOn: isDay(r.nw) ? r.nw : r.nd });
  })();
  // People who used the previous version aren't new: their first routine here isn't marked as a first visit
  if (store.get("everStarted", false) !== true && (store.get("setup", null) || store.get("agreed", null))) store.set("everStarted", true);
  // Which link someone came from (?from=reddit). Kept on the phone, sent once with the first routine.
  const linkFrom = (() => {
    const v = (new URLSearchParams(location.search).get("from") || "").toLowerCase();
    return /^[a-z0-9-]{1,20}$/.test(v) ? v : null;
  })();
  if (linkFrom && store.get("from", null) === null) store.set("from", linkFrom);
  // On iPhone the home-screen icon starts with empty storage. Point it at an address that carries the link
  // source and the anonymous ID and choices (after "#", never sent anywhere). Intentions are not carried:
  // they would end up in the address. Safari uses the manifest's start address if it reads it, otherwise the page's.
  function prepareIconStart(updateAddress = false) {
    if (!isIOS || onHomeScreen) return;
    const from = store.get("from", null);
    const known = hasAgreed();
    if (!from && !known) return;
    const rel = "./" + (from ? "?from=" + encodeURIComponent(from) : "") + (known ? "#r=" + carryState() : "");
    const abs = (u) => new URL(u, location.href).href;
    const m = { name: "Mornward", short_name: "Mornward", start_url: abs(rel), scope: abs("./"),
      display: "standalone", background_color: "#EDF5FC", theme_color: "#EDF5FC",
      icons: [{ src: abs("icons/icon-192.png"), sizes: "192x192", type: "image/png" },
              { src: abs("icons/icon-512.png"), sizes: "512x512", type: "image/png" }] };
    const link = document.querySelector('link[rel="manifest"]');
    if (link) link.href = "data:application/manifest+json," + encodeURIComponent(JSON.stringify(m));
    if (known && updateAddress) { try { history.replaceState(null, "", rel); } catch {} }
  }
  prepareIconStart();
  function shareUrl() {
    const from = store.get("from", null);
    return "https://mornward.app/" + (from ? "?from=" + encodeURIComponent(from) : "") + (hasAgreed() ? "#r=" + carryState() : "");
  }

  // ---------- which screen to show ----------
  // Today's routine picks up where it was (breathing comes back paused). A routine from an earlier date is
  // never shown as today's; it's under "Earlier intentions", dated. One started just before midnight can be finished.
  function home() {
    const today = dayKey();
    routine = store.get("routine", null, isRoutine);
    const r = routine;
    const current = r && (r.day === today ||
      (r.phase !== "done" && r.day === addDays(today, -1) && Date.now() - r.startedAt < CARRY_OVER_MS));
    if (!current) renderBegin();
    else if (r.phase === "breathe") renderBreathe(true);
    else if (r.phase === "choose") renderChoose();
    else if (r.phase === "finish") renderFinish();
    else renderToday();
  }
  // Phones keep pages alive for days. Coming back on a new date shows that day's Begin, unless a routine
  // is in progress on screen (breathing or typing), which stays put.
  let shownFor = dayKey();
  function checkDay() {
    if (document.hidden) return;
    const today = dayKey();
    if (today === shownFor) return;
    if (br || $("#intent")) return;
    shownFor = today;
    home();
  }
  document.addEventListener("visibilitychange", checkDay);
  window.addEventListener("pageshow", checkDay);
  setInterval(checkDay, 60000);

  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
  flushStats();
  home();
})();
</script>
